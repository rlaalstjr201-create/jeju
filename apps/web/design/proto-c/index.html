<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161817">

    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  })();

<style>
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --fill: #ebebe6;
  --fill-press: #dfdfd9;
  --line: #e2e2dc;
  --ink: #1b1d1c;
  --muted: #5b605e;
  --sel-bg: #1b1d1c;
  --sel-fg: #ffffff;
  --heart: #cc3a2f;
  --scrim: rgb(0 0 0 / 35%);
  --photo: none;

  --top-h: 52px;
  --r-ctl: 10px;
  --r-photo: 12px;
  --r-thumb: 8px;
  --r-sheet: 18px;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, Roboto, "Noto Sans KR", "Segoe UI", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161817;
    --surface: #1f2221;
    --fill: #2a2e2c;
    --fill-press: #353a38;
    --line: #2c302e;
    --ink: #e8e8e3;
    --muted: #a3a8a5;
    --sel-bg: #8e938f;
    --sel-fg: #161817;
    --heart: #ee7e71;
    --scrim: rgb(0 0 0 / 55%);
    --photo: brightness(0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161817;
  --surface: #1f2221;
  --fill: #2a2e2c;
  --fill-press: #353a38;
  --line: #2c302e;
  --ink: #e8e8e3;
  --muted: #a3a8a5;
  --sel-bg: #8e938f;
  --sel-fg: #161817;
  --heart: #ee7e71;
  --scrim: rgb(0 0 0 / 55%);
  --photo: brightness(0.9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 var(--font);
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
p { text-wrap: pretty; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { display: block; flex: none; }

/* ---------- frame ---------- */
.app {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 16px calc(28px + env(safe-area-inset-bottom));
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
.top {
  position: sticky;
  top: 0;
  z-index: 5;
  margin: 0 -16px;
  padding: 4px 6px;
  min-height: var(--top-h);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0 8px;
  background: var(--bg);
}
.basis, .saved-btn {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 10px;
  border-radius: var(--r-ctl);
  font-weight: 600;
  transition: background-color 120ms ease-out;
}
.basis { gap: 5px; }
.basis svg { width: 12px; height: 12px; color: var(--muted); }
.saved-btn { gap: 6px; min-width: 44px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.saved-btn svg { width: 18px; height: 18px; color: var(--heart); }
.saved-btn[aria-pressed="true"] { background: var(--fill); }
.basis:active, .saved-btn:active { background: var(--fill); }

main { flex: 1; display: flex; flex-direction: column; }

/* ---------- home ---------- */
.home { flex: 1; display: flex; flex-direction: column; }
.home::before { content: ""; flex: 2 1 16px; }
.home::after { content: ""; flex: 1 1 0; }
.date { color: var(--muted); font-variant-numeric: tabular-nums; }
.q { margin: 2px 0 18px; font-size: 24px; line-height: 1.3; letter-spacing: -0.02em; font-weight: 700; text-wrap: balance; }
.moods { list-style: none; margin: 0 -8px; padding: 0; }
.moods li { position: relative; }
.moods li::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 1px; background: var(--line); }
.moods li:first-child::before { content: ""; position: absolute; left: 8px; right: 8px; top: 0; height: 1px; background: var(--line); }
.mood {
  width: 100%;
  min-height: 60px;
  padding: 12px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-radius: var(--r-ctl);
  font-size: 19px;
  line-height: 1.35;
  letter-spacing: -0.01em;
  font-weight: 600;
  transition: background-color 120ms ease-out;
}
.mood:active { background: var(--fill); }
.mood svg { width: 20px; height: 20px; color: var(--ink); }
.any {
  align-self: flex-start;
  margin: 10px 0 0 -8px;
  min-height: 48px;
  padding: 0 8px;
  color: var(--muted);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 5px;
  border-radius: var(--r-ctl);
}
.any:active { background: var(--fill); }

/* ---------- result head ---------- */
.mood-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.mood-line h1 { font-size: 16px; line-height: 1.4; font-weight: 600; }
.textbtn {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 10px;
  margin-right: -10px;
  flex: none;
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
  border-radius: var(--r-ctl);
  white-space: nowrap;
}
.textbtn:active { background: var(--fill); }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-top: 2px; }
.tab {
  display: flex;
  min-width: 44px;
  min-height: 44px;
  margin-bottom: -1px;
  color: var(--muted);
  font-weight: 600;
}
.tab span { display: flex; align-items: center; border-bottom: 2px solid transparent; }
.tab[aria-pressed="true"] { color: var(--ink); }
.tab[aria-pressed="true"] span { border-bottom-color: var(--ink); }
.status { margin-top: 12px; font-size: 14px; line-height: 1.5; color: var(--muted); }
.status .textbtn { margin: 0 0 0 -10px; min-height: 44px; }

/* ---------- the pick (first card) ---------- */
.pick { position: relative; margin-top: 12px; }
.ph {
  display: block;
  aspect-ratio: 4 / 3;
  border-radius: var(--r-photo);
  overflow: hidden;
  background: var(--fill);
}
.ph img, .th img { width: 100%; height: 100%; object-fit: cover; display: block; filter: var(--photo); }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; }
.head h2, .head h3 { flex: 1; min-width: 0; }
.pick .head { margin-top: 12px; }
.pick h2 { padding-top: 1px; font-size: 20px; line-height: 1.35; letter-spacing: -0.01em; font-weight: 700; text-wrap: balance; }
.alias { display: inline-block; font-size: 14px; line-height: 1.45; letter-spacing: 0; font-weight: 400; color: var(--muted); }
.card-link { text-decoration: none; }
.card-link::after { content: ""; position: absolute; inset: -6px; border-radius: 14px; }
.card-link:focus-visible { outline: none; }
.card-link:focus-visible::after { outline: 2px solid var(--ink); outline-offset: 0; }
.reason { margin-top: 4px; text-wrap: pretty; }
.pick .reason { font-size: 16px; line-height: 1.55; }
.meta { margin-top: 6px; font-size: 14px; line-height: 1.45; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta .to { white-space: nowrap; }
.meta .dest { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; white-space: nowrap; }
.heart {
  position: relative;
  z-index: 1;
  flex: none;
  width: 44px;
  height: 44px;
  margin: -8px -11px -9px 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--muted);
}
.heart svg { width: 22px; height: 22px; transition: transform 100ms ease-out; }
.heart .fill { fill: none; stroke: currentColor; stroke-width: 1.7; }
.heart[aria-pressed="true"] { color: var(--heart); }
.heart[aria-pressed="true"] .fill { fill: currentColor; }
.heart:active svg { transform: scale(0.88); }
.book {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  margin-top: 2px;
  font-size: 14px;
  font-weight: 600;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}
.hint { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--ink); }

/* ---------- 아니면 + rows ---------- */
.or { margin: 28px 0 12px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.or b { font-weight: 600; }
.row { position: relative; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: start; }
.row + .row { margin-top: 20px; }
.row.noimg { grid-template-columns: minmax(0, 1fr); }
.th { width: 76px; aspect-ratio: 1; border-radius: var(--r-thumb); overflow: hidden; background: var(--fill); }
.row h3 { padding-top: 1px; font-size: 16px; line-height: 1.4; font-weight: 600; }
.row .reason { margin-top: 2px; font-size: 14px; line-height: 1.5; }
.row .meta { margin-top: 4px; }
.row .heart { margin-top: -10px; margin-bottom: -11px; }

.more {
  width: 100%;
  min-height: 48px;
  margin-top: 28px;
  padding: 0 16px;
  border-radius: var(--r-ctl);
  background: var(--fill);
  font-weight: 600;
  text-align: center;
  transition: background-color 120ms ease-out, transform 120ms ease-out;
}
.more:active { background: var(--fill-press); transform: scale(0.98); }

/* ---------- skeleton (no motion) ---------- */
.sk { margin-top: 12px; }
.sk-photo { aspect-ratio: 4 / 3; border-radius: var(--r-photo); background: var(--fill); }
.bar { height: 14px; border-radius: 4px; background: var(--fill); margin-top: 10px; }
.bar.t { height: 18px; margin-top: 14px; }
.sk-row { display: grid; grid-template-columns: 76px 1fr; gap: 14px; margin-top: 20px; }
.sk-row .sq { aspect-ratio: 1; border-radius: var(--r-thumb); background: var(--fill); }
.sk-row .bar:first-child { margin-top: 2px; }

/* ---------- notices (denied / outside / error) ---------- */
.notice { margin-top: 20px; }
.notice > p:first-child { font-size: 16px; line-height: 1.55; }
.notice .fine { margin-top: 16px; font-size: 14px; line-height: 1.5; color: var(--muted); }
.fill-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  margin-top: 16px;
  padding: 0 20px;
  border-radius: var(--r-ctl);
  background: var(--fill);
  font-weight: 600;
}
.fill-btn:active { background: var(--fill-press); }

/* ---------- areas (sheet + inline) ---------- */
.group { margin: 20px 0 8px; font-size: 14px; line-height: 1.45; color: var(--muted); font-weight: 400; }
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.chip {
  min-height: 44px;
  padding: 10px 12px;
  border-radius: var(--r-ctl);
  background: var(--fill);
  line-height: 1.3;
  overflow-wrap: anywhere;
  transition: background-color 120ms ease-out;
}
.chip:active { background: var(--fill-press); }
.chip[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-fg); font-weight: 600; }
@media (max-width: 300px) {
  /* 320px phones at 200% text land here too */
  .chips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row { grid-template-columns: minmax(0, 1fr); gap: 10px; }
}

/* ---------- saved ---------- */
.saved-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
.saved-head h1 { font-size: 24px; line-height: 1.3; letter-spacing: -0.02em; font-weight: 700; }
.sort { margin: 2px 0 20px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.saved-note { margin-top: 28px; font-size: 14px; line-height: 1.5; color: var(--muted); text-wrap: balance; }

/* ---------- sheet ---------- */
.sheet-root { position: fixed; inset: 0; z-index: 10; }
.sheet-root[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 160ms ease-out; }
.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  max-width: 480px;
  max-height: 88vh;
  max-height: 88dvh;
  margin: 0 auto;
  padding: 0 16px calc(24px + env(safe-area-inset-bottom));
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  transform: translateY(100%);
  transition: transform 190ms ease-in;
}
.sheet-root.open .scrim { opacity: 1; transition-duration: 200ms; }
.sheet-root.open .sheet { transform: none; transition: transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1); }
.sheet-root.instant .scrim, .sheet-root.instant .sheet { transition: none; }
.sheet-head {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 60px;
  padding-top: 6px;
  background: var(--surface);
}
.sheet-head h2 { font-size: 19px; line-height: 1.35; letter-spacing: -0.01em; font-weight: 700; text-wrap: balance; }
.sheet-head h2:focus { outline: none; }
.opts { border-top: 1px solid var(--line); }
.opt-row { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
.opt { flex: 1; min-width: 0; min-height: 60px; padding: 10px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.opt b { display: block; font-weight: 600; }
.opt small { display: block; font-size: 14px; line-height: 1.45; color: var(--muted); }
.opt svg { width: 20px; height: 20px; }
.opt-row .textbtn { margin-right: -10px; }
.stay-copy { color: var(--muted); font-size: 14px; line-height: 1.5; }
.primary {
  width: 100%;
  min-height: 48px;
  margin-top: 16px;
  padding: 0 16px;
  border-radius: var(--r-ctl);
  background: var(--sel-bg);
  color: var(--sel-fg);
  font-weight: 600;
  text-align: center;
}
.primary[aria-busy="true"] { opacity: 0.7; }
.err { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .heart:active svg, .more:active { transform: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="basis" id="basisBtn" type="button" aria-haspopup="dialog"></button>
    <button class="saved-btn" id="savedBtn" type="button" hidden></button>
  </header>
  <main id="main"></main>
  <p class="sr-only" id="sr" role="status" aria-live="polite"></p>
</div>
<div class="sheet-root" id="sheetRoot" hidden>
  <div class="scrim" data-act="close"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
</div>

const AREAS = [

const MOODS = [
  ['rest', '푹 쉬고 싶어'],
  ['walk', '좀 걷고 싶어'],

// ---------------------------------------------------------------------------------------------
// Travel (same rules as src/pick.ts): 직선 × 1.3, 차 40km/h · 걸음 4.5km/h, 5분 단위, 최소 5분.
// ---------------------------------------------------------------------------------------------
function km(a, b) {
  const r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r;
  const dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}
const step5 = (min) => Math.max(5, Math.round(min / 5) * 5);
const driveMin = (d) => step5(((d * 1.3) / 40) * 60);
const walkMin = (d) => step5(((d * 1.3) / 4.5) * 60);
const ISLANDS = [
  ['우도', 33.48, 33.53, 126.93, 126.98], ['비양도', 33.4, 33.42, 126.22, 126.24],
  ['가파도', 33.16, 33.18, 126.26, 126.28], ['마라도', 33.11, 33.125, 126.26, 126.275],
];
function islandOf(p) {
  for (const [name, a, b, c, d] of ISLANDS) if (p.lat >= a && p.lat <= b && p.lng >= c && p.lng <= d) return name;
  return null;
}
const fmt = (m) => (m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ''}`);
function trip(o, s) {
  const p = { lat: s.la, lng: s.ln };
  const from = islandOf(o.point);
  const to = islandOf(p);
  if (from !== to) return to ? `${to}라서 배를 타야 해요` : '본섬이라 배를 타고 나가야 해요';
  if (to) return `같은 ${to} 안이에요`;
  const d = km(o.point, p);
  if (o.isPoint && d < 1) return { how: '걸어서', min: walkMin(d) };
  return { how: '차로', min: driveMin(d) };
}
/** "애월에서 차로 약 5분" (with from) / "차로 약 5분" / "우도라서 배를 타야 해요" */
function tripText(o, s, withFrom) {
  const t = trip(o, s);
  if (typeof t === 'string') return t;
  return `${withFrom ? o.from + ' ' : ''}${t.how} 약 ${fmt(t.min)}`;
}

// State. One object; render() derives every pressed state, label and card from it.
// ---------------------------------------------------------------------------------------------
const S = {
  view: 'home', // home | cards | saved
  prevView: 'home',
  mood: null,
  sub: 'meal',
  reopen: false, // home opened from 바꾸기: show a check on the current mood
  basis: { kind: 'area', area: '애월' }, // gps | stay | area
  stay: null, // { area, point|null }
  perm: 'granted', // granted | denied
  phase: 'ready', // ready | loading | locating | denied | unavailable | outside | error
  offline: false,
  overlay: null, // null | basis | stay
  stayPhase: 'idle', // idle | locating | failed
  saved: [],
  savedView: [], // snapshot while the saved list is open (un-hearting keeps the row until you leave)
  shown: {}, // key -> ids last shown for that mood/sub (restored on mood switch)
  seen: {}, // key -> ids seen in this round
  restarted: {}, // key -> the round just ran out
  wrapped: false,
  hintSeen: true,
  hintFor: null,
};

function origin() {
  const b = S.basis;
  if (b.kind === 'gps') return { point: GPS_DEMO, isPoint: true, from: '여기서', label: '여기' };
  if (b.kind === 'stay' && S.stay) {
    const p = S.stay.point || area(S.stay.area);
    return { point: p, isPoint: !!S.stay.point, from: '숙소에서', label: '숙소' };
  }
  const a = area(b.area);
  return { point: a, isPoint: false, from: `${a.name}에서`, label: a.name };
}
const keyOf = () => (S.mood === 'food' ? `food:${S.sub}` : S.mood);

function pool(mood, sub, o) {
  const list = SPOTS.filter((s) => s.m === mood && (mood !== 'food' || s.sub === sub))
    .map((s) => ({ s, d: km(o.point, { lat: s.la, lng: s.ln }) }))
    .sort((a, b) => a.d - b.d || a.s.id.localeCompare(b.s.id));
  const near = list.filter((c) => driveMin(c.d) <= 60);
  return (near.length >= 3 ? near : list.slice(0, 3)).map((c) => c.s);
}
function rotate(list, key) {
  const seen = new Set(S.seen[key] || []);
  const last = new Set(S.shown[key] || []);
  const rank = (s) => (last.has(s.id) ? 2 : seen.has(s.id) ? 1 : 0);
  return list.map((s, i) => ({ s, i })).sort((a, b) => rank(a.s) - rank(b.s) || a.i - b.i).map((x) => x.s);
}
/** New 3 for the current mood (only 다른 3곳 보기 and a first visit call this). */
function drawNew() {
  const key = keyOf();
  const o = origin();
  let cards;
  let ids;
  if (S.mood === 'any') {
    const pools = ['rest', 'walk', 'new'].map((m) => pool(m, null, o));
    cards = pools.map((p) => rotate(p, key)[0]).filter(Boolean);
    cards.sort((a, b) => km(o.point, { lat: a.la, lng: a.ln }) - km(o.point, { lat: b.la, lng: b.ln }));
    ids = pools.flat().map((s) => s.id);
  } else {
    const p = pool(S.mood, S.sub, o);
    cards = rotate(p, key).slice(0, 3);
    ids = p.map((s) => s.id);
  }
  const seen = S.seen[key] || [];
  const cardIds = cards.map((c) => c.id);
  // wrapped = the first tap after everything nearby was shown once (pick.ts `restarted`)
  S.wrapped = !!S.restarted[key] || cards.some((c) => seen.includes(c.id));
  let next = [...new Set([...seen, ...cardIds])];
  S.restarted[key] = ids.every((id) => next.includes(id));
  if (S.restarted[key]) next = cardIds;
  S.seen[key] = next;
  S.shown[key] = cardIds;
}
function resetRounds() {
  S.shown = {};
  S.seen = {};
  S.restarted = {};
  S.wrapped = false;
}

    h += rest.map((s, i) => rowCard(s, same ? '' : texts[i], false)).join('');
  }
  h += `<button class="more" type="button" data-act="more">다른 3곳 보기</button>`;
  return h;
}

function renderSaved() {
  const o = origin();
  const list = S.savedView.map((id) => byId.get(id))
    .sort((a, b) => km(o.point, { lat: a.la, lng: a.ln }) - km(o.point, { lat: b.la, lng: b.ln }));
  const sortLabel = S.basis.kind === 'gps' ? '여기서 가까운 순' : S.basis.kind === 'stay' ? '숙소에서 가까운 순' : `${o.label}에서 가까운 순`;
  return `<div class="saved-head"><h1>저장한 곳</h1><button class="textbtn" type="button" data-act="close-saved">닫기</button></div>
    <p class="sort">${sortLabel}</p>
    ${list.map((s, i) => rowCard(s, tripText(o, s, true), i === 0)).join('')}
    <p class="saved-note">이 브라우저에만 저장돼요. 다른 기기나 앱에서는 안 보여요.</p>`;
}

function renderMain() {
  const main = $('#main');
  main.innerHTML = S.view === 'home' ? renderHome() : S.view === 'saved' ? renderSaved() : renderCards();
  for (const img of main.querySelectorAll('img[data-img]')) {
    img.addEventListener('error', () => {
      // photo failed: drop the whole photo slot, never an empty grey box
      const slot = img.closest('.ph, .th');
      const row = img.closest('.row');
      slot && slot.remove();
      row && row.classList.add('noimg');
    }, { once: true });
  }
}

function renderSheet() {
  const root = $('#sheetRoot');
  const sheet = $('#sheet');
  if (!S.overlay) return;
  if (S.overlay === 'basis') {
    const b = S.basis.kind;
    const staySub = S.stay ? `${S.stay.area} 숙소` : '처음 한 번만 정해요';
    const hereSub = S.perm === 'denied' ? '<small>위치 권한이 꺼져 있어요.</small>' : '';
    sheet.innerHTML = `<div class="sheet-head"><h2 id="sheetTitle" tabindex="-1">어디 근처로 볼까요?</h2><button class="textbtn" type="button" data-act="close">닫기</button></div>
      <div class="opts">
        <div class="opt-row"><button class="opt" type="button" data-basis="gps" aria-pressed="${b === 'gps'}"><span><b>지금 있는 곳</b>${hereSub}</span>${b === 'gps' ? ICON.check : ''}</button></div>
        <div class="opt-row"><button class="opt" type="button" data-basis="stay" aria-pressed="${b === 'stay'}"><span><b>숙소</b><small>${staySub}</small></span>${b === 'stay' ? ICON.check : ''}</button>${
          S.stay ? '<button class="textbtn" type="button" data-act="stay">다시 정하기</button>' : ''
        }</div>
      </div>
      ${chipsHtml(b === 'area' ? S.basis.area : null)}`;
  } else {
    const busy = S.stayPhase === 'locating';
    sheet.innerHTML = `<div class="sheet-head"><h2 id="sheetTitle" tabindex="-1">숙소가 어디예요?</h2><button class="textbtn" type="button" data-act="close">닫기</button></div>
      <p class="stay-copy">한 번 정하면 이 브라우저에 기억해 둬요.</p>
      <button class="primary" type="button" data-act="stay-here" aria-busy="${busy}">${busy ? '위치 확인 중…' : '지금 위치를 숙소로'}</button>
      ${S.stayPhase === 'failed' ? '<p class="err" role="alert">위치를 확인하지 못했어요. 아래에서 숙소 동네를 골라 주세요.</p>' : ''}
      ${chipsHtml(S.stay ? S.stay.area : null).replace(/data-area=/g, 'data-stay-area=')}`;
  }
  root.hidden = false;
}

function render() {
  renderTop();
  renderMain();
  if (S.overlay) renderSheet();
}

// ---------------------------------------------------------------------------------------------
// Intents
// ---------------------------------------------------------------------------------------------
const sr = (t) => { $('#sr').textContent = ''; setTimeout(() => ($('#sr').textContent = t), 30); };
let lastTap = { key: '', at: 0 };
function tooSoon(key) {
  const now = performance.now();
  const dup = lastTap.key === key && now - lastTap.at < 400;
  lastTap = { key, at: now };
  return dup;
}
let ticket = 0; // every intent takes a new ticket; a late result with an old ticket is dropped

function chooseMood(m) {
  if (tooSoon('mood:' + m)) return;
  const t = ++ticket;
  S.mood = m;
  S.view = 'cards';
  S.reopen = false;
  S.wrapped = false;
  if (S.basis.kind === 'gps' && S.perm === 'denied') S.phase = 'denied';
  else {
    S.phase = 'ready';
    if (!S.shown[keyOf()]) drawNew(); // coming back to a mood restores the three you last saw
  }
  render();
  window.scrollTo(0, 0);
  if (t === ticket && S.phase === 'ready') sr('3곳 골랐어요.');
}
function more() {
  if (tooSoon('more')) return;
  ++ticket;
  drawNew();
  render();
  window.scrollTo(0, 0);
  sr('다른 3곳을 골랐어요.');
}
function setSub(sub) {
  if (S.sub === sub) return;
  S.sub = sub;
  S.wrapped = false;
  if (!S.shown[keyOf()]) drawNew();
  render();
}
function setBasis(basis) {
  ++ticket;
  S.basis = basis;
  resetRounds();
  if (S.view === 'cards') {
    S.phase = basis.kind === 'gps' && S.perm === 'denied' ? 'denied' : 'ready';
    if (S.phase === 'ready') drawNew();
  }
  closeSheet(false);
  render();
  window.scrollTo(0, 0);
}
function toggleSave(id) {
  const on = !S.saved.includes(id);
  S.saved = on ? [...S.saved, id] : S.saved.filter((x) => x !== id);
  // update in place: no re-render, so photos never flicker
  for (const b of document.querySelectorAll(`[data-heart="${id}"]`)) b.setAttribute('aria-pressed', String(on));
  renderTop();
  if (on && !S.hintSeen) {
    S.hintSeen = true;
    const card = document.querySelector(`[data-card="${id}"]`);
    const at = card && (card.querySelector('.meta') || card.querySelector('.reason'));
    if (at) {
      const p = document.createElement('p');
      p.className = 'hint';
      p.textContent = '저장한 곳은 맨 위 하트에 모여요.';
      at.after(p); // stays until the next render: no second layout jump, no timer to race a half-asleep reader
    }
  }
}
function openSaved() {
  if (S.view === 'saved') return closeSaved();
  S.prevView = S.view;
  S.view = 'saved';
  S.savedView = [...S.saved];
  render();
  window.scrollTo(0, 0);
}
function closeSaved() {
  S.view = S.prevView;
  render();
}

let opener = null;
function openSheet(kind, instant) {
  opener = document.activeElement;
  S.overlay = kind;
  if (kind === 'stay') S.stayPhase = S.stayPhase === 'failed' ? 'failed' : 'idle';
  renderSheet();
  const root = $('#sheetRoot');
  root.classList.toggle('instant', !!instant);
  $('#app').inert = true;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => {
    root.classList.add('open');
    if (!instant) $('#sheetTitle').focus({ preventScroll: true });
  });
}
function closeSheet(restoreFocus = true) {
  if (!S.overlay) return;
  S.overlay = null;
  ++ticket; // a 숙소 lookup still running is dropped
  S.stayPhase = 'idle';
  const root = $('#sheetRoot');
  root.classList.remove('open', 'instant');
  $('#app').inert = false;
  document.body.style.overflow = '';
  const done = () => { if (!S.overlay) root.hidden = true; };
  matchMedia('(prefers-reduced-motion: reduce)').matches ? done() : setTimeout(done, 190);
  if (restoreFocus && opener && opener.isConnected) opener.focus({ preventScroll: true });
}
function showStaySheet() {
  S.overlay = 'stay';
  S.stayPhase = 'idle';
  renderSheet();
  $('#sheet').scrollTop = 0;
  $('#sheetTitle').focus({ preventScroll: true });
}
function stayHere() {
  if (S.stayPhase === 'locating') return;
  const t = ++ticket;
  S.stayPhase = 'locating';
  renderSheet();
  setTimeout(() => {
    if (t !== ticket || S.overlay !== 'stay') return; // sheet closed or something newer happened
    S.stay = { area: '애월', point: GPS_DEMO };
    S.stayPhase = 'idle';
    setBasis({ kind: 'stay' });
  }, 700);
}
function retry() {
  const t = ++ticket;
  S.phase = 'loading';
  render();
  setTimeout(() => {
    if (t !== ticket) return;
    S.phase = 'ready';
    drawNew();
    render();
    sr('3곳 골랐어요.');
  }, 700);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('button, [data-act]');
  if (!el) return;
  const d = el.dataset;
  if (d.heart) return toggleSave(d.heart);
  if (d.mood) return chooseMood(d.mood);
  if (d.sub) return setSub(d.sub);
  if (d.area) return setBasis({ kind: 'area', area: d.area });
  if (d.stayArea) {
    S.stay = { area: d.stayArea, point: null };
    return setBasis({ kind: 'stay' });
  }
  if (d.basis === 'gps') return setBasis({ kind: 'gps' });
  if (d.basis === 'stay') return S.stay ? setBasis({ kind: 'stay' }) : showStaySheet();
  if (el.id === 'basisBtn') return openSheet('basis');
  if (el.id === 'savedBtn') return openSaved();
  switch (d.act) {
    case 'change': S.view = 'home'; S.reopen = true; render(); return window.scrollTo(0, 0);
    case 'more': return more();
    case 'basis': return openSheet('basis');
    case 'close': return closeSheet();
    case 'close-saved': return closeSaved();
    case 'stay': return showStaySheet();
    case 'stay-here': return stayHere();
    case 'retry': return retry();
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.overlay) closeSheet(); });

// ---------------------------------------------------------------------------------------------
// Screens by hash, so every state can be screenshotted directly.
// ---------------------------------------------------------------------------------------------
const PRESETS = {
  home: {},
  cards: { mood: 'rest' },
  walk: { mood: 'walk' },
  new: { mood: 'new' },
  any: { mood: 'any' },
  food: { mood: 'food', sub: 'meal', basis: { kind: 'gps' } },
  cafe: { mood: 'food', sub: 'cafe', basis: { kind: 'gps' } },
  sheet: { mood: 'rest', overlay: 'basis' },
  stay: { mood: 'rest', overlay: 'stay', stay: null },
  'stay-fail': { mood: 'rest', overlay: 'stay', stay: null, stayPhase: 'failed' },
  saved: { view: 'saved' },
  empty: { mood: 'rest', basis: { kind: 'gps' }, perm: 'denied', phase: 'denied', saved: [] },
  unavailable: { mood: 'rest', basis: { kind: 'gps' }, phase: 'unavailable' },
  outside: { mood: 'rest', basis: { kind: 'gps' }, phase: 'outside' },
  locating: { mood: 'rest', basis: { kind: 'gps' }, phase: 'locating' },
  loading: { mood: 'rest', phase: 'loading' },
  error: { mood: 'rest', phase: 'error' },
  offline: { mood: 'rest', offline: true },
  island: { mood: 'rest', basis: { kind: 'area', area: '성산' } },
  wrapped: { mood: 'rest', wrapAround: true },
  first: { mood: 'rest', saved: [], hintSeen: false },
  hint: { mood: 'rest', saved: [], hintSeen: false, tapFirstHeart: true },
};
function applyHash() {
  const name = location.hash.slice(1) || 'home';
  const p = PRESETS[name] || PRESETS.home;
  if (S.overlay) closeSheet(false);
  Object.assign(S, {
    view: p.view || (p.mood ? 'cards' : 'home'),
    prevView: 'home',
    mood: p.mood || null,
    sub: p.sub || 'meal',
    reopen: false,
    basis: p.basis || { kind: 'area', area: '애월' },
    stay: 'stay' in p ? p.stay : { area: '애월', point: null },
    perm: p.perm || 'granted',
    phase: p.phase || 'ready',
    offline: !!p.offline,
    overlay: null,
    stayPhase: p.stayPhase || 'idle',
    saved: p.saved || ['7db4ec04', 'cb6f9e05'],
    hintSeen: p.hintSeen !== false,
  });
  S.savedView = [...S.saved];
  resetRounds();
  if (S.view === 'cards' && S.phase === 'ready') {
    drawNew();
    if (p.wrapAround) { drawNew(); drawNew(); }
  }
  render();
  if (p.tapFirstHeart) toggleSave(S.shown[keyOf()][0]);
  if (p.overlay) {
    if (p.overlay === 'stay') S.stayPhase = p.stayPhase || 'idle';
    openSheet(p.overlay, true);
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', applyHash);
applyHash();
</script>
</body>
</html>
