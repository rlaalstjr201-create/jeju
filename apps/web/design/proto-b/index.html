<style>
/* proto-b · 현장 안내서. 토큰과 부품 설명은 design.md */
:root {
  color-scheme: light;
  --paper: #f4f1ea;
  --leaf: #fbfaf6;
  --ink: #1f1d19;
  --ink2: #5d584f;
  --rule: #d8d2c5;
  --heavy: #1f1d19;
  --fill: #e8e4da;
  --press: #dcd7cb;
  --sel-bg: #1f1d19;
  --sel-fg: #f7f5ef;
  --heart: #b3312a;
  --dim: rgb(24 22 18 / 42%);
  --scrim: rgb(24 22 18 / 46%);
  --photo: none;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, Roboto, "Noto Sans KR", "Segoe UI", "Malgun Gothic", sans-serif;
  --thumb: 112px;
  --head-h: 53px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #1a1917;
    --leaf: #24231f;
    --ink: #e9e5dc;
    --ink2: #a7a195;
    --rule: #38352f;
    --heavy: #9d978a;
    --fill: #2a2824;
    --press: #34322d;
    --sel-bg: #726d64;
    --sel-fg: #f7f5ef;
    --heart: #e5796b;
    --dim: rgb(0 0 0 / 56%);
    --scrim: rgb(0 0 0 / 46%);
    --photo: brightness(0.9);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #1a1917;
  --leaf: #24231f;
  --ink: #e9e5dc;
  --ink2: #a7a195;
  --rule: #38352f;
  --heavy: #9d978a;
  --fill: #2a2824;
  --press: #34322d;
  --sel-bg: #726d64;
  --sel-fg: #f7f5ef;
  --heart: #e5796b;
  --dim: rgb(0 0 0 / 56%);
  --scrim: rgb(0 0 0 / 46%);
  --photo: brightness(0.9);
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--paper); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font: 400 0.9375rem/1.5 var(--font);
  letter-spacing: 0;
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
a { color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
[tabindex="-1"]:focus { outline: none; } /* 읽기 위치만 옮기는 제목 포커스 */
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* 글자 3단계: 24 · 17 · 15 */
.t-l { font-size: 1.5rem; line-height: 1.3; letter-spacing: -0.02em; font-weight: 700; text-wrap: balance; }

/* ── 쪽 머리(running head) ───────────────────────── */
.head {
  position: sticky; top: 0; z-index: 10;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 12px;
  min-height: var(--head-h);
  padding: env(safe-area-inset-top) 16px 0;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.basis {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; margin-left: -8px; padding: 0 8px;
  font-size: 0.9375rem; font-weight: 600; line-height: 1.3;
}
.basis svg { flex: none; color: var(--ink2); }
.saves {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  min-width: 44px; min-height: 44px; margin-right: -8px; padding: 0 8px;
  font-size: 0.9375rem; font-weight: 600;
}
.saves svg { color: var(--heart); }
.saves[aria-pressed="true"] .saves-n { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }

.page { max-width: 480px; margin: 0 auto; padding: 0 16px; }

/* 글자 버튼(바꾸기 · 닫기 · 돌아가기) */
.textbtn {
  display: inline-flex; flex: none; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0 4px; margin-right: -4px;
  font-size: 0.9375rem; font-weight: 600; white-space: nowrap;
  text-decoration: underline; text-decoration-color: var(--ink2); text-decoration-thickness: 1px; text-underline-offset: 4px;
}

/* ── 첫 화면 ─────────────────────────────────── */
.home {
  display: flex; flex-direction: column; justify-content: flex-end;
  min-height: calc(100vh - var(--head-h));
  min-height: calc(100svh - var(--head-h));
  padding-top: 32px; padding-bottom: calc(20px + env(safe-area-inset-bottom));
}
.date { color: var(--ink2); font-size: 0.9375rem; margin-bottom: 4px; }
.home h1 { margin-bottom: 20px; }
.moods { border-top: 2px solid var(--heavy); border-bottom: 2px solid var(--heavy); }
.moods li + li { border-top: 1px solid var(--rule); }
.mood {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; min-height: 58px; padding: 10px 4px;
  font-size: 1.0625rem; font-weight: 600; line-height: 1.4;
}
.mood svg { flex: none; color: var(--ink2); }
.any {
  display: inline-flex; align-items: center; min-height: 48px; margin-top: 8px; padding: 0 4px;
  font-size: 1.0625rem; font-weight: 600;
  text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: var(--ink2); text-underline-offset: 5px;
}

/* ── 결과 · 저장한 곳 ─────────────────────────── */
.rhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: 20px; }
.rhead h1 { padding-top: 5px; outline-offset: 4px; }
.rhead .count { color: var(--ink2); font-weight: 400; margin-left: 8px; }
.tabs { display: flex; gap: 20px; margin-top: 8px; }
.tab {
  min-width: 44px; min-height: 44px; padding: 0 2px;
  font-size: 1.0625rem; font-weight: 600; color: var(--ink2);
  border-bottom: 2px solid transparent;
}
.tab[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.standfirst { margin-top: 6px; color: var(--ink2); font-size: 0.9375rem; }
.standfirst .cue { display: block; }
.tabs + .standfirst { margin-top: 12px; }
.status { margin-top: 8px; font-size: 0.9375rem; color: var(--ink); display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; }

.entries { margin-top: 14px; border-top: 2px solid var(--heavy); border-bottom: 2px solid var(--heavy); }
.entry {
  position: relative;
  display: grid; grid-template-columns: minmax(0, 1fr) var(--thumb); column-gap: 14px; align-items: start;
  padding: 16px 0 18px;
}
.entry + .entry { border-top: 1px solid var(--rule); }
.entry.nophoto { grid-template-columns: minmax(0, 1fr) 44px; }
.entry-name { font-size: 1.0625rem; line-height: 1.4; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.entry-link { text-decoration: none; }
.entry-link::after { content: ""; position: absolute; inset: 0; z-index: 0; }
.entry-link:focus-visible { outline: none; }
.entry:has(.entry-link:focus-visible) { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 2px; }
.alias { display: inline-block; font-size: 0.9375rem; font-weight: 400; letter-spacing: 0; color: var(--ink2); }
.entry-reason { margin-top: 4px; font-size: 0.9375rem; line-height: 1.5; text-wrap: pretty; }
.entry-meta { margin-top: 6px; font-size: 0.9375rem; color: var(--ink2); }
.book {
  position: relative; z-index: 1;
  display: inline-flex; align-items: center; min-height: 44px; margin-bottom: -10px;
  font-size: 0.9375rem; font-weight: 600;
  text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: var(--ink2); text-underline-offset: 4px;
}
.hint { margin-top: 8px; font-size: 0.9375rem; color: var(--ink); }
.hint.fade { opacity: 0; }
.photo {
  display: block; width: 100%; aspect-ratio: 1; object-fit: cover;
  border-radius: 2px; background: var(--fill); filter: var(--photo);
}
.heart {
  position: absolute; z-index: 1; top: 16px; right: 0;
  display: grid; place-items: center; width: 44px; height: 44px;
}
.heart .disc { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--scrim); color: #fff; }
.heart[aria-pressed="true"] .disc { background: var(--leaf); color: var(--heart); }
.heart[aria-pressed="true"] path { fill: currentColor; }
.nophoto .heart { top: 8px; right: -6px; }
.nophoto .heart .disc { background: transparent; color: var(--ink2); }
.nophoto .heart[aria-pressed="true"] .disc { background: transparent; color: var(--heart); }

.more {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; min-height: 52px; margin-top: 20px; padding: 0 16px;
  background: var(--fill); border-radius: 4px;
  font-size: 1.0625rem; font-weight: 600;
}
.more svg { color: var(--ink2); flex: none; }
.foot { margin-top: 16px; font-size: 0.9375rem; color: var(--ink2); }
.end { height: calc(28px + env(safe-area-inset-bottom)); }

/* 자리 표시(회색 틀). 움직임 없음 */
.skel .bar { display: block; height: 12px; margin: 6px 0 12px; border-radius: 2px; background: var(--fill); }
.skel .bar:first-child { height: 16px; width: 46%; margin-top: 4px; }
.skel .w90 { width: 92%; } .skel .w70 { width: 68%; }
.skel .ph { aspect-ratio: 1; border-radius: 2px; background: var(--fill); }

/* 안내(권한 꺼짐 · 목록 실패) */
.notice { margin-top: 18px; padding-top: 16px; border-top: 2px solid var(--heavy); }
.notice-title { font-size: 1.0625rem; font-weight: 600; line-height: 1.4; }
.notice-body { margin-top: 4px; color: var(--ink2); }
.primary {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; min-height: 52px; margin-top: 16px; padding: 0 16px; border-radius: 4px;
  background: var(--sel-bg); color: var(--sel-fg); font-size: 1.0625rem; font-weight: 600;
}

/* ── 동네 목록(색인) ─────────────────────────── */
.group { display: flex; align-items: baseline; gap: 8px; margin-top: 22px; padding-bottom: 6px; font-size: 0.9375rem; font-weight: 600; color: var(--ink2); }
.group span { font-weight: 400; }
/* 칸 폭은 글자 크기(em)를 따른다: 390px 3칸, 320px 2칸, 글자 200%면 1칸 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.4em, 1fr)); column-gap: 8px; border-bottom: 1px solid var(--rule); }
.grid.two { grid-template-columns: repeat(auto-fill, minmax(max(6.4em, calc(50% - 4px)), 1fr)); }
.grid > li { border-top: 1px solid var(--rule); padding: 4px 0; }
.cell {
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  width: 100%; min-height: 54px; padding: 6px 8px; border-radius: 2px;
}
.cell-name { font-size: 1.0625rem; font-weight: 600; line-height: 1.3; }
.cell-mark { font-size: 0.9375rem; line-height: 1.35; color: var(--ink2); }
.cell[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-fg); }
.cell[aria-pressed="true"] .cell-mark { color: inherit; }
.cell:disabled { cursor: default; }
.cell:disabled .cell-name { color: var(--ink2); }
@media (max-width: 359px) { :root { --thumb: 88px; } }
/* 글자를 크게 키워 글 칸이 좁아지면 사진을 위로 올린다 */
.entries { container: entries / inline-size; }
@container entries (max-width: 18em) {
  .entry, .entry.nophoto { grid-template-columns: minmax(0, 1fr); }
  .entry-photo { order: -1; margin-bottom: 12px; }
  .entry .photo, .skel .ph { aspect-ratio: 16 / 9; }
  .entry.nophoto .entry-text { padding-right: 44px; }
}

/* ── 시트 ─────────────────────────────────────── */
.sheet-root { position: fixed; inset: 0; z-index: 50; }
.dim { position: absolute; inset: 0; background: var(--dim); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px;
  max-height: 88vh; max-height: 88dvh; overflow: auto; overscroll-behavior: contain;
  background: var(--leaf); border-radius: 14px 14px 0 0;
  padding: 0 16px calc(16px + env(safe-area-inset-bottom));
}
.sheet-head {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 60px; padding-top: 4px; background: var(--leaf);
}
.sheet-head h2 { font-size: 1.0625rem; font-weight: 700; line-height: 1.4; letter-spacing: -0.01em; }
.sheet .grid:first-of-type { margin-top: 2px; }
.sheet .notice-body { margin-top: 0; }
.sheet .note { margin-top: 10px; font-size: 0.9375rem; color: var(--ink); }
.sheet .foot { margin-top: 12px; }
.sheet-tail { display: flex; justify-content: flex-start; margin-top: 8px; }

/* 누름 반응과 움직임: 동작 줄이기면 전부 끔 */
.mood:active, .cell:active:not([aria-pressed="true"]):not(:disabled) { background: var(--fill); }
.more:active { background: var(--press); }
@media (prefers-reduced-motion: no-preference) {
  .more, .primary { transition: transform 120ms ease-out, background-color 120ms ease-out; }
  .more:active, .primary:active { transform: scale(0.98); }
  .heart .disc { transition: transform 120ms ease-out; }
  .heart:active .disc { transform: scale(0.88); }
  .hint { transition: opacity 150ms ease-out; }
  .sheet-root.open .sheet { animation: sheet-in 240ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .sheet-root.open .dim { animation: dim-in 200ms ease-out; }
  .sheet-root.closing .sheet { animation: sheet-out 190ms ease-in forwards; }
  .sheet-root.closing .dim { animation: dim-out 160ms ease-in forwards; }
}
@keyframes sheet-in { from { transform: translateY(100%); } }
@keyframes sheet-out { to { transform: translateY(100%); } }
@keyframes dim-in { from { opacity: 0; } }
@keyframes dim-out { to { opacity: 0; } }
</style>
</head>

// ── 이동 문구 (src/pick.ts와 같은 계산) ──
const RAD = Math.PI / 180;
function km(a, b) {
  const dLat = (b.lat - a.lat) * RAD, dLng = (b.lng - a.lng) * RAD;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * RAD) * Math.cos(b.lat * RAD) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}
const round5 = (m) => Math.max(5, Math.round(m / 5) * 5);
const driveMin = (k) => round5(((k * 1.3) / 40) * 60);
const walkMin = (k) => round5(((k * 1.3) / 4.5) * 60);
const ISLANDS = [['우도', 33.48, 33.53, 126.93, 126.98], ['비양도', 33.4, 33.42, 126.22, 126.24], ['가파도', 33.16, 33.18, 126.26, 126.28], ['마라도', 33.11, 33.125, 126.26, 126.275]];
const islandOf = (p) => (ISLANDS.find((i) => p.lat >= i[1] && p.lat <= i[2] && p.lng >= i[3] && p.lng <= i[4]) || [null])[0];
const fmt = (m) => (m < 60 ? `${m}분` : m % 60 ? `${Math.floor(m / 60)}시간 ${m % 60}분` : `${m / 60}시간`);
function travel(o, s) {
  const from = islandOf(o.p), to = islandOf(s);
  if (from !== to) return { move: false, text: to ? `${to}라서 배를 타야 해요` : '본섬이라 배를 타고 나가야 해요' };
  if (to) return { move: false, text: `같은 ${to} 안이에요` };
  const d = km(o.p, s);
  if (o.point && d < 1) return { move: true, text: `걸어서 약 ${fmt(walkMin(d))}` };
  return { move: true, text: `차로 약 ${fmt(driveMin(d))}` };
}

// ── 상태 ──
const SAVED = ['aa983e52', '19ac84ab']; // 그린비즈, 우도봉
function preset(name) {
  const base = {
    view: 'home', mood: null, sub: 'meal', phase: 'cards', basis: 'area', area: '애월', stay: { area: '애월' },
    overlay: null, pages: {}, saved: [...SAVED], snap: null, mapCue: !mapOpened(), gpsDenied: false, note: '', stayBusy: false, stayError: '',
  };
  const p = {
    first: { basis: 'gps', stay: null, saved: [] },
    cards: { view: 'results', mood: 'new' },
    food: { view: 'results', mood: 'food', sub: 'meal' },
    'food-cafe': { view: 'results', mood: 'food', sub: 'cafe' },
    sheet: { view: 'results', mood: 'new', overlay: 'basis' },
    saved: { view: 'saved' },
    empty: { view: 'results', mood: 'rest', basis: 'gps', gpsDenied: true, phase: 'denied' },
    loading: { view: 'results', mood: 'walk', basis: 'gps', phase: 'locating' },
    error: { view: 'results', mood: 'new', phase: 'error' },
    stay: { stay: null, overlay: 'stay' },
    offline: { view: 'results', mood: 'rest', offline: true },
  }[name] || {};
  const s = { ...base, ...p };
  if (s.view === 'saved') s.snap = [...s.saved];
  return s;
}
function mapOpened() { try { return localStorage.getItem('protob.mapOpened') === '1'; } catch { return false; } }
const CUE = '<span class="cue">누르면 카카오맵이 열려요.</span>';
function parseHash() {
  const parts = location.hash.replace(/^#/, '').split('&');
  const theme = parts.find((x) => x === 'dark' || x === 'light');
  if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme;
  return parts[0] || 'home';
}
let S = preset(parseHash());

function origin() {
  if (S.basis === 'gps') return { p: GPS_POINT, point: true, from: '여기서', near: '지금 있는 곳에서' };
  if (S.basis === 'stay' && S.stay) {
    return S.stay.point ? { p: S.stay.point, point: true, from: '숙소에서', near: '숙소에서' }
      : { p: area(S.stay.area), point: false, from: '숙소에서', near: '숙소에서' };
  }
  const a = area(S.area);
  return { p: a, point: false, from: `${a.label}에서`, near: `${a.label}에서` };
}
function pool(mood, sub) {
  const o = origin().p;
  const all = SPOTS.filter((s) => s.mood === mood && (mood !== 'food' || s.sub === sub))
    .map((s) => ({ s, d: km(o, s) })).sort((a, b) => a.d - b.d);
  const near = all.filter((x) => driveMin(x.d) <= 60);
  return (near.length >= 3 ? near : all.slice(0, 3)).map((x) => x.s);
}
const chunk = (a) => { const out = []; for (let i = 0; i + 3 <= a.length; i += 3) out.push(a.slice(i, i + 3)); return out; };
const key = () => (S.mood === 'food' ? `food:${S.sub}` : S.mood);
function pages() {
  if (S.mood === 'any') {
    const [r, w, n] = ['rest', 'walk', 'new'].map((m) => pool(m));
    const o = origin().p, out = [];
    for (let i = 0; i < Math.min(r.length, w.length, n.length); i++) out.push([r[i], w[i], n[i]].sort((a, b) => km(o, a) - km(o, b)));
    return out;
  }
  return chunk(pool(S.mood, S.sub));
}
const current = () => { const p = pages(); return p[(S.pages[key()] || 0) % p.length] || []; };

// ── 경로(history): {view, mood, sub, overlay, depth}만 담는다 ──
const snapNav = (depth) => ({ view: S.view, mood: S.mood, sub: S.sub, overlay: S.overlay, depth });
const depth = () => (history.state && history.state.depth) || 0;
function push() { history.pushState(snapNav(depth() + 1), ''); }
function back(fallback) {

  Object.assign(S, fallback); history.replaceState(snapNav(0), ''); render();
}
addEventListener('popstate', (e) => {
  const st = e.state;
  if (!st) { S = preset(parseHash()); history.replaceState(snapNav(0), ''); render(); return; }
  if (st.view === 'saved' && S.view !== 'saved') S.snap = [...S.saved];
  Object.assign(S, { view: st.view, mood: st.mood, sub: st.sub, overlay: st.overlay, stayBusy: false });
  render();
});
addEventListener('hashchange', () => { S = preset(parseHash()); history.replaceState(snapNav(0), ''); render(); scrollTo(0, 0); });

function kakaoUrl(s) {
  const name = s.name.replace(/\s*\(.*\)\s*$/, '');
  if (s.kakao) return `https://place.map.kakao.com/${encodeURIComponent(s.kakao)}`;
  const q = /제주|서귀포/.test(name) ? name : `제주 ${name}`;
  return `https://map.kakao.com/link/search/${encodeURIComponent(q)}`;
}

function entryHtml(s, meta) {

function mainHtml() {

    return `<section class="home" aria-labelledby="title">

  // results

  if (S.phase === 'error') {
    return `${head}${tabs}
      <div class="notice"><p class="notice-title">목록을 불러오지 못했어요.</p>
      <p class="notice-body">연결을 확인하고 다시 불러와 주세요.</p>
      <button class="more" type="button" data-act="retry"><span>다시 불러오기</span></button></div><div class="end"></div>`;
  }
  if (S.phase === 'locating') {
    const bar = '<li class="entry" aria-hidden="true"><div><span class="bar"></span><span class="bar w90"></span><span class="bar w70"></span></div><div class="ph"></div></li>';
    return `${head}${tabs}
      <p class="status" role="status"><span>위치 확인 중…</span><button class="textbtn" type="button" data-act="open-basis">지역으로 고르기</button></p>
      <ol class="entries skel">${bar}${bar}${bar}</ol><div class="end"></div>`;
  }
  const o = origin();
  const cards = current();
  const trips = cards.map((s) => travel(o, s));
  const same = trips.length > 1 && trips.every((t) => t.text === trips[0].text);
  const n = cards.length === 3 ? '셋' : '둘';
  let lead;
  if (same && trips[0].move) lead = `${n} 다 ${o.from} ${trips[0].text}이에요.`;
  else if (same) lead = `${n} 다 ${trips[0].text}.`;
  else lead = `${o.near} 가까운 순이에요.`;
  return `${head}${tabs}
    <p class="standfirst">${esc(lead)}${S.mapCue ? CUE : ''}</p>
    ${S.note ? `<p class="status" role="status">${esc(S.note)}</p>` : ''}
    ${S.offline ? '<p class="status" role="status">오프라인이라 사진은 안 보여요.</p>' : ''}
    <ol class="entries">${cards.map((s, i) => entryHtml(s, same ? '' : trips[i].text)).join('')}</ol>
    <button class="more" type="button" data-act="more"><span>다른 3곳 보기</span>${ICON.arrow}</button>
    <div class="end"></div>`;
}

function sheetHtml() {
  if (S.overlay === 'basis') {
    const stayMark = S.stay ? (S.stay.point ? '지금 위치로 정함' : area(S.stay.area).label) : '처음 한 번만 정해요';
    return `<div class="sheet-head"><h2 id="sheet-title" tabindex="-1">어디 근처로 볼까요?</h2><button class="textbtn" type="button" data-act="close">닫기</button></div>
      <ul class="grid two">
        <li><button class="cell" type="button" data-act="gps" aria-pressed="${S.basis === 'gps' && !S.gpsDenied}">
          <span class="cell-name">내 위치</span><span class="cell-mark">${S.gpsDenied ? '위치 권한이 꺼져 있어요' : '지금 있는 곳'}</span></button></li>
        <li><button class="cell" type="button" data-act="stay" aria-pressed="${S.basis === 'stay'}">
          <span class="cell-name">숙소</span><span class="cell-mark">${esc(stayMark)}</span></button></li>
      </ul>
      ${areasHtml(S.basis === 'area' ? S.area : null, 'area')}
      ${S.stay ? '<div class="sheet-tail"><button class="textbtn" type="button" data-act="stay-reset">숙소 다시 정하기</button></div>' : ''}`;
  }
  if (S.overlay === 'stay') {
    return `<div class="sheet-head"><h2 id="sheet-title" tabindex="-1">숙소가 어디예요?</h2><button class="textbtn" type="button" data-act="close">닫기</button></div>
      <p class="notice-body">한 번 정하면 이 기기에 기억해 둘게요.</p>
      <button class="primary" type="button" data-act="stay-gps" ${S.stayBusy ? 'aria-disabled="true"' : ''}><span>${S.stayBusy ? '위치 확인 중…' : '지금 위치를 숙소로'}</span></button>
      ${S.stayError ? `<p class="note" role="status">${esc(S.stayError)}</p>` : ''}
      ${areasHtml(S.stay && !S.stay.point ? S.stay.area : null, 'stay-area')}`;
  }
  return '';
}

let lastMain = '', lastSheet = '', closingTimer = 0;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function render() {
  // 쪽 머리
  $('basis-label').textContent = basisLabel();
  $('basis').setAttribute('aria-label', `${basisLabel()}, 기준 바꾸기`);
  const n = S.saved.length;
  $('saves').hidden = n === 0 && S.view !== 'saved';
  $('saves-n').textContent = n;
  $('saves').setAttribute('aria-label', `저장한 곳 ${n}개`);
  $('saves').setAttribute('aria-pressed', String(S.view === 'saved'));
  // 본문: 내용이 바뀔 때만 다시 쓴다(하트는 아래에서 맞춘다)
  const html = mainHtml();
  if (html !== lastMain) { $('main').innerHTML = html; lastMain = html; wireImages(); }
  document.querySelectorAll('.heart').forEach((b) => b.setAttribute('aria-pressed', String(S.saved.includes(b.dataset.id))));
  // 시트
  const root = $('sheet-root');
  const open = !!S.overlay;
  $('main').inert = open; $('head').inert = open;
  if (open) {
    clearTimeout(closingTimer); root.classList.remove('closing');
    const sh = sheetHtml();
    if (sh !== lastSheet) { $('sheet').innerHTML = sh; lastSheet = sh; }
    if (root.hidden) { root.hidden = false; root.classList.add('open'); const t = $('sheet-title'); t && t.focus({ preventScroll: true }); }
  } else if (!root.hidden && !root.classList.contains('closing')) {
    root.classList.remove('open'); root.classList.add('closing'); lastSheet = '';
    closingTimer = setTimeout(() => { root.hidden = true; root.classList.remove('closing'); $('basis').focus({ preventScroll: true }); }, reduced() ? 0 : 190);
  }
}
function wireImages() {
  document.querySelectorAll('.photo').forEach((img) => {
    const drop = () => { const li = img.closest('.entry'); img.parentElement.remove(); li && li.classList.add('nophoto'); };
    if (img.complete && img.naturalWidth === 0 && img.src) drop(); else img.addEventListener('error', drop, { once: true });
  });
}
const live = (t) => { $('live').textContent = ''; setTimeout(() => { $('live').textContent = t; }, 30); };

// ── 행동 ──
const lastTap = {};
const tooSoon = (k) => { const now = Date.now(), t = lastTap[k] || 0; lastTap[k] = now; return now - t < 400; };
let reqId = 0;
function toTop() { scrollTo(0, 0); const t = $('title'); t && t.focus({ preventScroll: true }); }

document.addEventListener('click', (e) => {
  if (e.target.closest('.entry-link') && S.mapCue) { // 한 번 열어 본 뒤로는 안내 문장을 뺀다
    try { localStorage.setItem('protob.mapOpened', '1'); } catch {}
    setTimeout(() => { S.mapCue = false; render(); }, 300);
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'mood') {
    if (tooSoon(`mood:${el.dataset.mood}`)) return;
    S.mood = el.dataset.mood; S.view = 'results'; S.note = '';
    S.phase = S.basis === 'gps' && S.gpsDenied ? 'denied' : 'cards';
    push(); render(); toTop(); if (S.phase === 'cards') live('3곳 골랐어요.');
  } else if (act === 'more') {
    if (tooSoon('more')) return;
    const k = key(), total = pages().length, next = ((S.pages[k] || 0) + 1) % total;
    S.pages[k] = next;
    S.note = next === 0 ? '이 근처는 다 봤어요. 처음 본 곳부터 다시 보여 드려요.' : '';
    render(); toTop(); live(`다른 3곳 골랐어요.`);
  } else if (act === 'sub') {
    if (S.sub === el.dataset.sub) return;
    S.sub = el.dataset.sub; S.note = ''; history.replaceState(snapNav(depth()), ''); render();
  } else if (act === 'home') {
    back({ view: 'home', mood: null, note: '' });
  } else if (act === 'heart') {
    const id = el.dataset.id, was = S.saved.length;
    S.saved = S.saved.includes(id) ? S.saved.filter((x) => x !== id) : [...S.saved, id];
    render();
    if (was === 0 && S.saved.length === 1 && S.view === 'results') firstSaveHint(el.closest('.entry'));
  } else if (act === 'retry') {
    S.phase = 'cards'; render(); live('3곳 골랐어요.');
  } else if (act === 'open-basis') {
    S.overlay = 'basis'; push(); render();
  } else if (act === 'close') {
    reqId++; back({ overlay: null, stayBusy: false, stayError: '' });
  } else if (act === 'area') {
    S.basis = 'area'; S.area = el.dataset.area;
    if (S.view === 'results') { S.phase = 'cards'; S.note = ''; }
    if (S.view === 'saved') S.snap = [...S.saved];
    if (S.overlay) back({ overlay: null }); else render();
    if (S.view === 'results') live('3곳 골랐어요.');
  } else if (act === 'gps') {
    if (S.gpsDenied) return;
    S.basis = 'gps'; if (S.view === 'results') S.phase = 'cards';
    back({ overlay: null });
  } else if (act === 'stay') {
    if (S.stay) { S.basis = 'stay'; if (S.view === 'results') S.phase = 'cards'; back({ overlay: null }); }
    else { S.overlay = 'stay'; history.replaceState(snapNav(depth()), ''); render(); const t = $('sheet-title'); t && t.focus(); }
  } else if (act === 'stay-reset') {
    S.overlay = 'stay'; history.replaceState(snapNav(depth()), ''); render(); const t = $('sheet-title'); t && t.focus();
  } else if (act === 'stay-area') {
    S.stay = { area: el.dataset.area }; S.basis = 'stay'; if (S.view === 'results') S.phase = 'cards';
    back({ overlay: null });
  } else if (act === 'stay-gps') {
    if (S.stayBusy) return;
    const id = ++reqId; S.stayBusy = true; S.stayError = ''; render();
    setTimeout(() => {
      if (id !== reqId || S.overlay !== 'stay') return; // 닫혔거나 새 요청: 결과를 버린다
      S.stayBusy = false; S.stay = { point: { ...GPS_POINT } }; S.basis = 'stay';
      if (S.view === 'results') S.phase = 'cards';
      back({ overlay: null });
    }, 800);
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.overlay) { reqId++; back({ overlay: null, stayBusy: false }); } });
document.getElementById('saves').addEventListener('click', () => {
  if (S.view === 'saved') { back({ view: 'home' }); return; }
  S.snap = [...S.saved]; S.view = 'saved'; push(); render(); toTop();
});
document.getElementById('basis').addEventListener('click', () => { S.overlay = 'basis'; push(); render(); });

function firstSaveHint(li) {
  if (!li || li.querySelector('.hint')) return;
  const p = document.createElement('p');
  p.className = 'hint'; p.textContent = '저장한 곳은 맨 위 하트 버튼에 모여요.';
  li.querySelector('.entry-text').appendChild(p);
  setTimeout(() => { p.classList.add('fade'); setTimeout(() => p.remove(), reduced() ? 0 : 160); }, 2600);
}

history.scrollRestoration = 'manual';
history.replaceState(snapNav(0), '');
render();
})();
</script>
</body>
</html>
