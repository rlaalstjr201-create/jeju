<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>내일 뭐하지</title>
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151718" media="(prefers-color-scheme: dark)">
<!--
  시안 A · 조용한 도구. 정적 프로토타입, 외부 요청은 스팟 사진뿐.
  상태: #home #cards #food #food-cafe #sheet #stay #saved #empty #loading #noimg #error #hint
  테마 고정: ?theme=dark 또는 ?theme=light (없으면 기기 설정)
-->
<style>
[hidden] { display: none !important; }

/* ---------- tokens ---------- */
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --fill: #eaeae5;
  --fill-press: #dfdfda;
  --line: #e1e1dc;
  --text: #191b1c;
  --muted: #5c6164;
  --sel-bg: #191b1c;
  --sel-fg: #ffffff;
  --sel-sub: #c9cbc8;
  --accent: #d23c32;
  --scrim: rgb(0 0 0 / 35%);
  --photo: none;

  --t-ask: 1.5rem;       /* 24 */
  --t-title: 1.25rem;    /* 20 */
  --t-name: 1.0625rem;   /* 17 */
  --t-body: 0.9375rem;   /* 15 */

  --top-h: 52px;
  --r-ctl: 10px;
  --r-photo: 12px;
  --r-thumb: 8px;
  --r-sheet: 18px;
  --thumb: clamp(80px, 24vw, 104px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151718;
    --surface: #1d2022;
    --fill: #262a2d;
    --fill-press: #303538;
    --line: #2c3033;
    --text: #e9e9e4;
    --muted: #a4aaad;
    --sel-bg: #8e938f;
    --sel-fg: #151718;
    --sel-sub: #25292c;
    --accent: #f08276;
    --scrim: rgb(0 0 0 / 55%);
    --photo: brightness(0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151718;
  --surface: #1d2022;
  --fill: #262a2d;
  --fill-press: #303538;
  --line: #2c3033;
  --text: #e9e9e4;
  --muted: #a4aaad;
  --sel-bg: #8e938f;
  --sel-fg: #151718;
  --sel-sub: #25292c;
  --accent: #f08276;
  --scrim: rgb(0 0 0 / 55%);
  --photo: brightness(0.9);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
html.lock { overflow: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, Roboto, "Noto Sans KR", "Segoe UI", "Malgun Gothic", sans-serif;
  font-size: var(--t-body);
  line-height: 1.5;
  font-weight: 400;
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-tap-highlight-color: transparent;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  cursor: pointer;
  text-align: left;
  touch-action: manipulation;
}
a { color: inherit; text-decoration: none; }
svg { display: block; flex: none; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 6px; }
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }
.sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}
.num { font-variant-numeric: tabular-nums; }

/* ---------- frame ---------- */
.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 0 max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
main { flex: 1; display: flex; flex-direction: column; }

/* top row: two quiet corners, nothing in the middle */
.top {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0 8px;
  min-height: calc(var(--top-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 16px 0;
  margin: 0 -16px;
  background: var(--bg);
}
.basis {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 44px;
  margin-left: -8px;
  padding: 0 8px;
  font-weight: 600;
  white-space: nowrap;
  border-radius: var(--r-ctl);
}
.basis svg { color: var(--muted); }
.saved-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 44px;
  min-height: 44px;
  margin-left: auto;
  margin-right: -8px;
  padding: 0 10px;
  font-weight: 600;
  white-space: nowrap;
  border-radius: var(--r-ctl);
}
.saved-btn svg { fill: var(--accent); }
.saved-btn[aria-pressed="true"] { background: var(--fill); }

/* ---------- home ---------- */
.home { flex: 1; display: flex; flex-direction: column; }
.home::before { content: ""; flex: 5 1 24px; }
.home::after { content: ""; flex: 2 1 0; }
.date { min-height: 1.5em; color: var(--muted); font-variant-numeric: tabular-nums; }
.ask {
  margin-top: 4px;
  font-size: var(--t-ask);
  line-height: 1.3;
  letter-spacing: -0.02em;
  font-weight: 700;
  text-wrap: balance;
}
.moods { list-style: none; margin: 20px -16px 0; padding: 0; }
.moods li { position: relative; }
.moods li + li::before {
  content: "";
  position: absolute;
  top: 0; left: 16px; right: 16px;
  height: 1px;
  background: var(--line);
}
.mood {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  min-height: 60px;
  padding: 14px 16px;
  font-size: var(--t-name);
  line-height: 1.4;
  letter-spacing: -0.01em;
  font-weight: 600;
}
.mood:active { background: var(--fill); }
.mood svg { color: var(--muted); }
.mood[aria-current="true"] svg { color: var(--text); }
.any {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  min-height: 48px;
  margin-top: 8px;
  font-size: var(--t-name);
  line-height: 1.4;
  letter-spacing: -0.01em;
  font-weight: 600;
  text-decoration: underline;
  text-decoration-color: var(--muted);
  text-decoration-thickness: 1px;
  text-underline-offset: 5px;
}

/* ---------- results head ---------- */
.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 44px;
  margin-top: 4px;
}
.title {
  font-size: var(--t-title);
  line-height: 1.35;
  letter-spacing: -0.01em;
  font-weight: 700;
  text-wrap: balance;
  scroll-margin-top: calc(var(--top-h) + 4px);
}
.count { margin-left: 6px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.change {
  min-height: 44px;
  margin-right: -8px;
  padding: 0 8px;
  font-weight: 600;
  white-space: nowrap;
  border-radius: var(--r-ctl);
}
.tabs { display: flex; gap: 8px; margin-top: 4px; border-bottom: 1px solid var(--line); }
.tab:first-child { margin-left: -8px; }
.tab { position: relative; min-width: 44px; min-height: 44px; padding: 0 8px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tab[aria-pressed="true"] { color: var(--text); }
.tab[aria-pressed="true"]::after {
  content: "";
  position: absolute;
  left: 8px; right: 8px; bottom: -1px;
  height: 2px;
  background: var(--text);
}
.status {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0 12px;
  margin-top: 12px;
  color: var(--muted);
  text-wrap: pretty;
}
.status:empty { display: none; }
.link-btn {
  min-height: 44px;
  font-weight: 600;
  color: var(--text);
  text-decoration: underline;
  text-decoration-color: var(--muted);
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

/* ---------- cards: things you read have no box ---------- */
.picks { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; container-type: inline-size; }
.alt { margin: 8px 0 -8px; color: var(--muted); }
.card { position: relative; }
.ph { overflow: hidden; background: var(--fill); }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; filter: var(--photo); }
.lead .ph { aspect-ratio: 3 / 2; border-radius: var(--r-photo); margin-bottom: 12px; }
.row { display: grid; grid-template-columns: var(--thumb) minmax(0, 1fr); column-gap: 12px; align-items: start; }
.row .ph { aspect-ratio: 1; border-radius: var(--r-thumb); }
.row.noimg { grid-template-columns: minmax(0, 1fr); }
.body { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 4px; align-items: start; }
.name {
  grid-column: 1;
  grid-row: 1;
  font-size: var(--t-name);
  line-height: 1.4;
  letter-spacing: -0.01em;
  font-weight: 600;
  text-wrap: balance;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}
.lead .name { font-size: var(--t-title); line-height: 1.35; font-weight: 700; }
.alias { display: inline-block; font-size: var(--t-body); line-height: 1.5; font-weight: 400; letter-spacing: 0; color: var(--muted); }
.card-link::after { content: ""; position: absolute; inset: 0; }
.card-link:focus-visible { outline: none; }
.card:has(.card-link:focus-visible) { outline: 2px solid var(--text); outline-offset: 4px; border-radius: var(--r-photo); }
.card:has(.card-link:active) :is(.ph, .name) { opacity: 0.72; }
.heart {
  position: relative;
  z-index: 1;
  grid-column: 2;
  grid-row: 1;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin: -10px -10px -10px 0;
  color: var(--muted);
  border-radius: 50%;
}
.heart svg { fill: none; stroke: currentColor; stroke-width: 1.8; }
.heart[aria-pressed="true"] { color: var(--accent); }
.heart[aria-pressed="true"] svg { fill: currentColor; }
.reason { grid-column: 1 / -1; margin-top: 2px; text-wrap: pretty; }
.row .reason { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.meta { grid-column: 1 / -1; margin-top: 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
.book {
  position: relative;
  z-index: 1;
  grid-column: 1 / -1;
  justify-self: start;
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  margin-bottom: -8px;
  font-weight: 600;
}
.hint { grid-column: 1 / -1; margin-top: 6px; color: var(--muted); }
@container (max-width: 20em) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .row .ph { aspect-ratio: 2 / 1; margin-bottom: 12px; }
}

/* the one repeat action rides under the thumb until the list ends */
.more-bar {
  position: sticky;
  bottom: 0;
  z-index: 2;
  margin: 16px -16px 0;
  padding: 12px 16px max(12px, env(safe-area-inset-bottom));
  background: var(--bg);
  border-top: 1px solid transparent;
}
.more-bar.stuck { border-top-color: var(--line); }
.fill-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 52px;
  padding: 8px 16px;
  border-radius: var(--r-ctl);
  background: var(--fill);
  font-size: var(--t-name);
  line-height: 1.4;
  font-weight: 600;
  text-align: center;
}
.fill-btn:active { background: var(--fill-press); }
.sentinel { height: 1px; margin-top: -1px; }

/* ---------- placeholder frames (no shimmer) ---------- */
.skel { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
.sk-ph { aspect-ratio: 3 / 2; border-radius: var(--r-photo); background: var(--fill); }
.skel i { display: block; height: 14px; margin-top: 10px; border-radius: 4px; background: var(--fill); }
.sk-lead i:first-of-type { height: 18px; margin-top: 12px; }
.sk-row { display: grid; grid-template-columns: var(--thumb) minmax(0, 1fr); column-gap: 12px; }
.sk-row .sk-th { aspect-ratio: 1; border-radius: var(--r-thumb); background: var(--fill); }
.sk-row i:first-child { margin-top: 4px; }

/* ---------- notice in the card slot ---------- */
.notice { margin-top: 20px; }
.notice-t { font-size: var(--t-name); line-height: 1.4; font-weight: 600; }
.notice-b { margin-top: 4px; color: var(--muted); text-wrap: pretty; }
.notice-f { margin-top: 20px; color: var(--muted); text-wrap: pretty; }
.notice .fill-btn { margin-top: 20px; }
.group-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 24px 0 8px; }
.group-h h3 { font-size: var(--t-body); font-weight: 600; color: var(--muted); }
.group-h span { color: var(--muted); }
.areas {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(max(4em, calc((100% - 24px) / 4)), 1fr));
  gap: 8px;
}
.opt {
  min-height: 48px;
  padding: 8px 10px;
  border-radius: var(--r-ctl);
  background: var(--fill);
  font-weight: 600;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.opt:active { background: var(--fill-press); }
.opt[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-fg); }

/* ---------- saved ---------- */
.sort { margin-top: 4px; color: var(--muted); text-wrap: pretty; }
.foot { margin-top: 28px; color: var(--muted); text-wrap: pretty; }

/* ---------- sheet: the only floating surface ---------- */
#overlay { position: relative; z-index: 10; }
.scrim { position: fixed; inset: 0; background: var(--scrim); }
.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  max-width: 480px;
  max-height: 88dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-radius: var(--r-sheet) var(--r-sheet) 0 0;
}
.sheet-in { overflow-y: auto; overscroll-behavior: contain; padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
.sheet h2 { font-size: var(--t-title); line-height: 1.35; letter-spacing: -0.01em; font-weight: 700; text-wrap: balance; }
.sheet-d { margin-top: 4px; color: var(--muted); }
.bases { display: grid; grid-template-columns: repeat(auto-fit, minmax(max(8em, 40%), 1fr)); gap: 8px; margin-top: 16px; }
.opt.big { display: flex; flex-direction: column; justify-content: center; min-height: 60px; padding: 8px 12px; }
.opt .sub { font-weight: 400; color: var(--muted); }
.opt[aria-pressed="true"] .sub { color: var(--sel-sub); }
.opt:disabled { cursor: default; }
.restay { min-height: 44px; margin-top: 4px; font-weight: 600; color: var(--muted); }
.primary {
  display: flex; align-items: center; justify-content: center;
  width: 100%; min-height: 48px; margin-top: 16px; padding: 8px 16px;
  border-radius: var(--r-ctl);
  background: var(--fill);
  font-weight: 600; text-align: center;
}
.primary:active { background: var(--fill-press); }
.primary:disabled { cursor: default; }
.err { margin-top: 8px; }
.err:empty { display: none; }
.close {
  flex: none;
  width: 100%;
  min-height: calc(56px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  border-top: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  font-weight: 600;
  text-align: center;
}

/* ---------- motion only where it explains ---------- */
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: sheet-in 240ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .scrim { animation: fade-in 200ms ease-out; }
  #overlay.closing .sheet { animation: sheet-out 190ms ease-in forwards; }
  #overlay.closing .scrim { animation: fade-out 160ms ease-in forwards; }
  .fill-btn, .opt, .primary { transition: background-color 120ms ease-out, transform 120ms ease-out; }
  .fill-btn:active, .opt:active { transform: scale(0.98); }
  .heart svg { transition: transform 120ms ease-out; }
  .heart:active svg { transform: scale(0.88); }
  .hint.out { opacity: 0; transition: opacity 150ms ease-out; }
}
@keyframes sheet-in { from { transform: translateY(100%); } }
@keyframes sheet-out { to { transform: translateY(100%); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
</style>
</head>
<body>
<div id="app" class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<div id="overlay" hidden></div>
<p id="announce" class="sr" aria-live="polite"></p>

<script>
(function () {
  'use strict';

  /* ---------- theme override for screenshots ---------- */
  var qs = new URLSearchParams(location.search);
  var forced = qs.get('theme');
  if (forced === 'dark' || forced === 'light') document.documentElement.setAttribute('data-theme', forced);

  /* ---------- real spots from public/spots.json (near 애월) ---------- */
  var SPOTS = [
    { id: 'rest-sangga', name: '상가리야자숲', lat: 33.4392078, lng: 126.3582800, mood: 'rest', reason: '야자수 숲 사이에서 잠시 여유를 누려요.', image: 'https://api.cdn.visitjeju.net/photomng/thumbnailpath/202407/18/5c4ee10a-8534-4278-a01a-972da115e4ec.webp', kakao: '878819879', bookable: false },
    { id: 'rest-oksu', name: '골목카페옥수', lat: 33.4397945, lng: 126.3800766, mood: 'rest', reason: '소길리, 레트로 소품이 곳곳에 있는 카페예요.', image: 'https://api.cdn.visitjeju.net/photomng/thumbnailpath/202203/04/202c5cb8-fd33-4967-a1c6-1e9aa0fce2a7.webp', kakao: '481425144', bookable: false },
    { id: 'rest-first', name: '너와의 첫여행', lat: 33.4506213, lng: 126.3845773, mood: 'rest', reason: '70년 된 감귤저장창고, 귤밭 보며 음료와 디저트를 즐겨요.', image: 'https://api.cdn.visitjeju.net/photomng/thumbnailpath/202203/07/88e9af89-761a-4bfa-8f6a-f38c3e4e7e9b.webp', kakao: '325110055', bookable: false },
    { id: 'rest-hago', name: '하고수동해변', lat: 33.514126, lng: 126.958595, mood: 'rest', reason: '우도 북쪽, 바다빛이 아름다운 해변이에요.', image: 'https://api.cdn.visitjeju.net/photomng/imgpath/202111/01/0b54058b-c3c7-4c62-b8ee-109a7a2bffb8.webp', kakao: '8132634', bookable: false },
    { id: 'walk-sogil', name: '풋감마을 소길리 농어촌체험마을', lat: 33.440056, lng: 126.380005, mood: 'walk', reason: '옛 올레길이 그대로 남은 소길리를 걸어요.', image: 'https://api.cdn.visitjeju.net/photomng/thumbnailpath/201804/30/6c47b20f-7efe-4b2c-8ce3-60439bf04087.webp', kakao: null, bookable: true },
    { id: 'walk-bari', name: '족은바리메', lat: 33.4435579, lng: 126.3533489, mood: 'walk', reason: '능선을 따라 이어지는 탐방로가 좋아요.', image: 'https://api.cdn.visitjeju.net/photomng/thumbnailpath/201804/30/f86a93a6-11b6-4665-9c81-62484abfabe5.webp', kakao: null, bookable: false },

  function skeleton() {
    var row = '<div class="sk-row"><div class="sk-th"></div><div><i style="width:55%"></i><i style="width:92%"></i><i style="width:40%"></i></div></div>';
    return '<div class="skel" aria-hidden="true"><div class="sk-lead"><div class="sk-ph"></div><i style="width:42%"></i><i style="width:86%"></i><i style="width:34%"></i></div>' + row + row + '</div>';
  }

  function renderResults() {
    var head = '<div class="head"><h1 class="title" id="rt" tabindex="-1">' + MOOD[S.mood] + '</h1><button class="change" type="button" data-act="change" aria-label="기분 바꾸기">바꾸기</button></div>';
    var tabs = S.mood === 'food'
      ? '<div class="tabs" role="group" aria-label="먹을 것 종류"><button class="tab" type="button" data-sub="meal" aria-pressed="' + (S.sub === 'meal') + '">식사</button><button class="tab" type="button" data-sub="cafe" aria-pressed="' + (S.sub === 'cafe') + '">카페·디저트</button></div>'
      : '';
    var status = '';
    if (S.status === 'locating') status = '<span>위치 확인 중…</span><button class="link-btn" type="button" data-act="basis">지역으로 고르기</button>';
    else if (S.status === 'loop') status = '이 근처는 다 봤어요. 처음 본 곳부터 다시 보여 드려요.';
    var body;
    if (S.notice === 'denied') {
      body = '<div class="notice"><h2 class="notice-t">위치 권한이 꺼져 있어요.</h2><p class="notice-b">내일 갈 동네를 고르면 거기서 가까운 곳을 보여 드려요.</p>' +
        areaGroups(null, 'data-pick-area') +
        '<p class="notice-f">위치를 쓰려면 브라우저 설정에서 위치 권한을 켜 주세요.</p></div>';
    } else if (S.notice === 'error') {
      body = '<div class="notice"><h2 class="notice-t">목록을 불러오지 못했어요.</h2><p class="notice-b">연결을 확인하고 다시 불러와 주세요.</p><button class="fill-btn" type="button" data-act="retry">다시 불러오기</button></div>';
    } else if (S.loading) {
      body = skeleton();
    } else {
      var o = origin(), cards = currentCards();
      var ts = cards.map(function (c) { return travel(o, c); });
      var same = cards.length > 1 && ts.every(function (t) { return t.text === ts[0].text; });
      var html = '';
      cards.forEach(function (c, i) {
        var meta;
        if (i === 0) meta = (same ? (cards.length === 3 ? '셋 다 ' : '둘 다 ') : '') + esc(withFrom(ts[0], o)) + DEST;
        else meta = same ? '' : esc(ts[i].text);
        if (i === 1) html += '<p class="alt">아니면</p>';
        html += cardHTML(c, i === 0 ? 'lead' : 'row', meta);
      });
      body = '<div class="picks">' + html + '</div>' +
        '<div class="more-bar" id="moreBar"><button class="fill-btn" type="button" data-act="more">다른 3곳 보기</button></div><div class="sentinel" id="sentinel"></div>';
    }
    return '<section class="results" aria-labelledby="rt">' + head + tabs + '<p class="status" id="status" role="status">' + status + '</p>' + body + '</section>';
  }

  function renderSaved() {
    var o = origin(), ids = (S.snap || S.saved).slice();
    var list = ids.map(function (id) { return SPOT[id]; });
    if (o.pt) list.sort(function (a, b) { return km(o.pt, a) - km(o.pt, b); });
    var rows = list.map(function (s) {
      var meta = o.pt ? esc(withFrom(travel(o, s), o)) + DEST : '카카오맵';
      return cardHTML(s, 'row', meta);
    }).join('');
    var n = S.saved.length;
    return '<section class="saved-view" aria-labelledby="st">' +
      '<div class="head"><h1 class="title" id="st" tabindex="-1">저장한 곳<span class="count">' + n + '</span></h1><button class="change" type="button" data-act="back">돌아가기</button></div>' +
      (list.length
        ? '<p class="sort">' + o.sort + '</p><div class="picks">' + rows + '</div>'
        : '<p class="sort">저장한 곳이 없어요. 카드의 하트를 누르면 여기 모여요.</p>') +
      '<p class="foot">이 브라우저에만 저장돼요.</p></section>';
  }

  function renderSheet() {
    if (!S.overlay) {
      if (!$sheet.hidden && !$sheet.classList.contains('closing')) {
        var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        $sheet.classList.add('closing');
        setTimeout(function () { if (!S.overlay) { $sheet.hidden = true; $sheet.classList.remove('closing'); $sheet.innerHTML = ''; } }, reduce ? 0 : 190);
      }
      return;
    }
    $sheet.classList.remove('closing');
    var inner;
    if (S.overlay === 'basis') {
      var gpsSub = S.gps === 'denied' ? '<span class="sub">위치 권한이 꺼져 있어요</span>' : '';
      var staySub = '<span class="sub">' + (S.stay ? esc(area(S.stay).label) : '처음 한 번만 정해요') + '</span>';
      inner = '<h2 id="sh" tabindex="-1">어디 근처로 볼까요?</h2>' +
        '<div class="bases">' +
          '<button class="opt big" type="button" data-base="gps" aria-pressed="' + (S.basis === 'gps') + '"><span>내 위치</span>' + gpsSub + '</button>' +
          '<button class="opt big" type="button" data-base="stay" aria-pressed="' + (S.basis === 'stay') + '"><span>숙소</span>' + staySub + '</button>' +
        '</div>' +
        (S.stay ? '<button class="restay" type="button" data-act="restay">숙소 다시 정하기</button>' : '') +
        areaGroups(S.basis === 'area' ? S.area : null, 'data-area');
    } else {
      inner = '<h2 id="sh" tabindex="-1">숙소가 어디예요?</h2>' +
        '<p class="sheet-d">한 번 정하면 이 기기에 기억해 둘게요.</p>' +
        '<button class="primary" type="button" data-act="stay-gps"' + (S.stayBusy ? ' disabled' : '') + '>' + (S.stayBusy ? '위치 확인 중…' : '지금 위치를 숙소로') + '</button>' +
        '<p class="err" role="status">' + esc(S.stayErr) + '</p>' +
        areaGroups(S.stay, 'data-stay');
    }
    $sheet.innerHTML = '<div class="scrim" data-act="close"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh"><div class="sheet-in">' + inner + '</div>' +
      '<button class="close" type="button" data-act="close">닫기</button></div>';
    $sheet.hidden = false;
  }

  var io = null;
  function watchMoreBar() {
    if (io) { io.disconnect(); io = null; }
    var bar = document.getElementById('moreBar'), sen = document.getElementById('sentinel');
    if (!bar || !sen || !('IntersectionObserver' in window)) return;
    io = new IntersectionObserver(function (es) {
      bar.classList.toggle('stuck', !es[0].isIntersecting);
    });
    io.observe(sen);
  }

  function render() {
    renderTop();
    $main.innerHTML = S.view === 'home' ? renderHome() : S.view === 'saved' ? renderSaved() : renderResults();
    renderSheet();
    $app.inert = !!S.overlay;
    document.documentElement.classList.toggle('lock', !!S.overlay);
    watchMoreBar();
  }

  /* ---------- intents ---------- */
  var lastTap = { key: '', t: 0 };
  function guard(key) { var now = Date.now(); if (lastTap.key === key && now - lastTap.t < 400) return true; lastTap = { key: key, t: now }; return false; }
  function say(t) { $announce.textContent = ''; setTimeout(function () { $announce.textContent = t; }, 50); }
  function focusTitle() { var t = document.querySelector('.title'); if (t) t.focus({ preventScroll: true }); }

  function chooseMood(m) {
    if (guard('mood')) return;
    S.mood = m; S.lastMood = m; S.view = 'results'; S.status = '';
    S.notice = S.basis === 'gps' && S.gps === 'denied' ? 'denied' : null;
    render(); window.scrollTo(0, 0); focusTitle();
    if (!S.notice) say('3곳 골랐어요.');
  }
  function more() {
    if (guard('more')) return;
    var key = poolKey(), pool = POOLS[key];
    S.pages[key] = (S.pages[key] || 0) + 1;
    S.status = S.pages[key] * 3 >= pool.length && (S.pages[key] * 3) % pool.length === 0 ? 'loop' : '';
    render();
    var t = document.querySelector('.title');
    if (t && t.getBoundingClientRect().top < 0) t.scrollIntoView({ block: 'start' });
    focusTitle();
    say('다른 3곳 골랐어요.');
  }
  function toggleHeart(id, btn) {
    var i = S.saved.indexOf(id), wasEmpty = S.saved.length === 0;
    if (i >= 0) S.saved.splice(i, 1); else S.saved.push(id);
    document.querySelectorAll('[data-heart="' + id + '"]').forEach(function (b) { b.setAttribute('aria-pressed', String(i < 0)); });
    renderTop();
    if (i < 0 && wasEmpty && !S.hintSeen && S.view === 'results') {
      S.hintSeen = true;
      var body = btn.closest('.body'), p = document.createElement('p');
      p.className = 'hint'; p.setAttribute('aria-live', 'polite'); p.textContent = '저장한 곳은 맨 위 하트 버튼에 모여요.';
      body.appendChild(p);
      setTimeout(function () { p.classList.add('out'); setTimeout(function () { p.remove(); }, 160); }, 3000);
    }
  }
  function openSaved() {
    if (S.view === 'saved') return goBack();
    S.back = S.view; S.view = 'saved'; S.snap = S.saved.slice();
    render(); window.scrollTo(0, 0); focusTitle();
  }
  function goBack() { S.view = S.back || 'home'; S.snap = null; render(); window.scrollTo(0, 0); focusTitle(); }
  var opener = null;
  function openSheet(kind) {
    opener = document.activeElement;
    S.overlay = kind; render();
    var sel = $sheet.querySelector('[aria-pressed="true"]') || document.getElementById('sh');
    if (sel) sel.focus();
  }
  function closeSheet() {
    S.overlay = null; S.stayBusy = false; S.stayErr = ''; render();
    var b = document.querySelector('[data-act="basis"]');
    (opener && document.contains(opener) ? opener : b).focus();
  }
  function basisChanged() {
    S.pages = {}; S.status = '';
    if (S.view === 'results') {
      S.notice = S.basis === 'gps' && S.gps === 'denied' ? 'denied' : null;
      S.loading = false;
    }
    closeSheet();
    if (S.view === 'results' && !S.notice) say('3곳 골랐어요.');
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, [data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (t.hasAttribute('data-mood')) return chooseMood(t.getAttribute('data-mood'));
    if (t.hasAttribute('data-heart')) return toggleHeart(t.getAttribute('data-heart'), t);
    if (t.hasAttribute('data-sub')) { if (S.sub !== t.getAttribute('data-sub')) { S.sub = t.getAttribute('data-sub'); S.status = ''; render(); } return; }
    if (t.hasAttribute('data-area')) { S.basis = 'area'; S.area = t.getAttribute('data-area'); return basisChanged(); }
    if (t.hasAttribute('data-pick-area')) { S.basis = 'area'; S.area = t.getAttribute('data-pick-area'); S.notice = null; S.pages = {}; render(); focusTitle(); say('3곳 골랐어요.'); return; }
    if (t.hasAttribute('data-stay')) { S.stay = t.getAttribute('data-stay'); S.basis = 'stay'; return basisChanged(); }
    if (t.hasAttribute('data-base')) {
      var b = t.getAttribute('data-base');
      if (b === 'stay' && !S.stay) { S.overlay = 'stay'; render(); return; }
      S.basis = b; return basisChanged();
    }
    switch (act) {
      case 'basis': return openSheet('basis');
      case 'close': return closeSheet();
      case 'restay': S.overlay = 'stay'; render(); document.getElementById('sh').focus(); return;
      case 'stay-gps':
        S.stayBusy = true; S.stayErr = ''; renderSheet();
        setTimeout(function () {
          if (S.overlay !== 'stay' || !S.stayBusy) return; // sheet closed meanwhile: drop the answer
          S.stayBusy = false; S.stay = nearestArea(GPS_PT).name; S.basis = 'stay'; basisChanged();
        }, 700);
        return;
      case 'change': S.view = 'home'; S.status = ''; render(); window.scrollTo(0, 0); var cur = document.querySelector('[aria-current="true"]') || document.querySelector('.mood'); if (cur) cur.focus({ preventScroll: true }); return;
      case 'more': return more();
      case 'saved': return openSaved();
      case 'back': return goBack();
      case 'retry': S.notice = null; render(); focusTitle(); say('3곳 골랐어요.'); return;
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.overlay) closeSheet(); });
  // A photo that fails leaves no grey box: the card becomes text only.
  document.addEventListener('error', function (e) {
    var img = e.target;
    if (!img || img.tagName !== 'IMG') return;
    var card = img.closest('.card');
    if (!card) return;
    S.broken[card.getAttribute('data-id')] = true;
    img.closest('.ph').remove();
    card.classList.add('noimg');
  }, true);

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  function boot() { S = initial(location.hash.slice(1)); render(); window.scrollTo(0, 0); }
  window.addEventListener('hashchange', boot);
  boot();
})();
</script>
</body>
</html>
