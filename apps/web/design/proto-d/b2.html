<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B′안 · 회색 바탕, 고친 판</title>
<link rel="stylesheet" href="mock.css">
<style>
  /* B′: 히어로 사진 뺌(답습 판정). 맨 위는 행동으로 이어지는 오늘 판. 타일 사진은 지금 동네 1위, 아래에 섞여 나오는 종류 */
  body { background: var(--page); }
  .top { background: var(--page); }
  .panel { background: #fff; border-radius: var(--r-panel); margin: 0 12px 12px; padding: 14px 16px; }
  .panel.today-p { padding: 8px 16px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; margin: 14px 0 8px; padding: 0; list-style: none; }
  .tile img { width: 100%; aspect-ratio: 4 / 3; border-radius: var(--r-photo); }
  .tile b { display: block; font-size: 17px; margin-top: 6px; line-height: 1.35; }
  .tile small { display: block; color: var(--muted); font-size: 15px; line-height: 1.35; }
  .any2 { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); font-size: 17px; font-weight: 700; color: var(--text); }
  .panel .sub { margin-bottom: 10px; }
  .foot { padding-top: 12px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="basis" href="#"><span id="basis">여기 근처</span> <svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4l4 4 4-4"/></svg></a>
    <span class="brand">계획귀찮아 · 제주</span>
  </header>
  <div class="panel today-p"><div class="today2" id="today"></div></div>
  <div class="panel">
    <h1 class="h1">지금 뭐 하고 싶어요?</h1>
    <p class="sub" style="margin:2px 0 0">하나 고르면 근처 3곳을 골라 드려요</p>
    <ul class="tiles" id="tiles"></ul>
    <a class="any2" id="any" href="#">아무거나 골라줘</a>
  </div>
  <div class="panel" id="market">
    <h2 class="h2">오늘 장 서는 곳</h2>
    <p class="sub">차로 30분 안, 오늘 장이 서는 오일장</p>
    <div class="list"></div>
  </div>
  <div class="panel">
    <h2 class="h2">다른 동네 둘러보기</h2>
    <p class="sub">여행 중 다음에 갈 동네를 미리 볼 때</p>
    <div class="areas" id="areas"></div>
  </div>
  <p class="foot">정보·사진: 비짓제주(제주관광공사) · <a href="#">소개</a> · <a href="#">개인정보</a></p>
</div>
<span class="note">B′안 목업</span>
<script src="mock2.js"></script>
<script>
  load().then(() => {
    document.getElementById('basis').textContent = `${AREA.name} 근처`;
    today(document.getElementById('today'), 'b2.html');
    document.getElementById('tiles').innerHTML = Object.keys(LABEL).map(m => {
      const top = moodPool(m)[0];
      return `<li><a class="tile" href="result2.html?${keep({ mood: m, v: 'b' })}"><img src="${top.s.image}" alt=""><b>${LABEL[m]}</b><small>${RANGE[m]}</small></a></li>`;
    }).join('');
    document.getElementById('any').href = `result2.html?${keep({ mood: 'any', v: 'b' })}`;
    markets(document.getElementById('market'));
    areas(document.getElementById('areas'));
  });
</script>
</body>
</html>
