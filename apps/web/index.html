<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>내일 뭐하지</title>
    <meta name="description" content="기분 버튼 한 번이면 제주에서 내일 갈 곳 세 군데를 골라 드려요." />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1f1e" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <p class="brand">내일 뭐하지</p>
        <div class="top-actions">
          <button id="saved" class="saved" type="button" hidden>♥ 0</button>
          <button id="basis" class="basis" type="button">내 위치 기준 ⇄</button>
        </div>
      </header>
      <h1 class="ask">내일은 어떤 기분이에요?</h1>
      <div class="moods">
        <button type="button" class="mood" data-mood="rest" aria-pressed="false">푹 쉬고 싶어</button>
        <button type="button" class="mood" data-mood="walk" aria-pressed="false">좀 걷고 싶어</button>
        <button type="button" class="mood" data-mood="new" aria-pressed="false">새로운 거 해보고 싶어</button>
        <button type="button" class="mood" data-mood="food" aria-pressed="false">맛있는 거 먹고 싶어</button>
        <button type="button" class="mood" data-mood="any" aria-pressed="false">아무거나 골라줘</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="foodSub" class="food-sub" hidden>
        <button type="button" class="sub-btn" data-sub="meal" aria-pressed="true">식사</button>
        <button type="button" class="sub-btn" data-sub="cafe" aria-pressed="false">카페·디저트</button>
      </div>
      <section id="cards" class="cards" aria-live="polite" aria-label="추천 장소"></section>
    </main>
    <div id="sheet" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
