  <body>
    <div id="app" class="app">
      <header class="top">
        <button id="basis" class="basis" type="button" aria-haspopup="dialog" aria-label="내 위치 근처, 기준 바꾸기"><span>내 위치 근처</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <button id="saved" class="saved-btn" type="button" aria-pressed="false" aria-label="저장한 곳 0개" hidden><svg width="16" height="16" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.3s-7.4-4.5-9.2-9.1C1.6 8 3.5 4.6 6.9 4.6c2.1 0 3.6 1.2 5.1 3 1.5-1.8 3-3 5.1-3 3.4 0 5.3 3.4 4.1 6.6-1.8 4.6-9.2 9.1-9.2 9.1z"/></svg><span class="n">0</span></button>
      </header>
      <main id="main">
        <section id="home" aria-labelledby="ask">
          <p class="brand">여행귀:제주 · P를 위한 여행동반자</p>
          <!-- 오늘 판 (ADR-0075 2): the date and folded grey facts; render.ts adds the one row to tap, if any -->
          <div class="today" id="today"><p class="today-line"><span id="date"></span><span class="facts"></span></p></div>
          <h1 class="ask" id="ask">지금 뭐 하고 싶어요?</h1>
          <p class="lede">지금 내 위치 근처에서 갈 만한 곳 3곳을 골라 드려요. 마음에 들면 바로 길찾기로 가요.</p>
          <!-- each row's 「예:」 and two photos come with the data (render.ts); the label is its own span -->
          <ul class="moods">
            <li><button class="mood" type="button" data-mood="rest"><span class="txt"><span class="label">푹 쉬고 싶어</span></span><svg class="i-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></li>
            <li><button class="mood" type="button" data-mood="walk"><span class="txt"><span class="label">좀 걷고 싶어</span></span><svg class="i-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></li>
            <li><button class="mood" type="button" data-mood="new"><span class="txt"><span class="label">새로운 거 해보고 싶어</span></span><svg class="i-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></li>
            <li><button class="mood" type="button" data-mood="food"><span class="txt"><span class="label">맛있는 거 먹고 싶어</span></span><svg class="i-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></li>
          </ul>
          <button class="any" type="button" data-mood="any"><span>아무거나 골라줘</span><svg class="i-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
          <!-- ADR-0063: a backup link to merge, or the in-app browser notice (filled by render.ts) -->
          <div id="homeNote" class="inform" hidden></div>
          <!-- ADR-0075 4: 오늘 장 서는 곳 and 다른 동네 둘러보기, drawn once the data is in (render.ts) -->
          <div id="homeMore" class="home-more"></div>
          <!-- for readers without JS (AI crawlers, specs/seo-landing.md OQ3): what the app is, and the static pages (ADR-0072) -->
          <noscript>
            <h2>여행귀:제주는 어떤 앱이에요?</h2>
            <p>여행귀:제주는 여행 계획 짜기 귀찮은 P를 위한 여행동반자로, 계획 없이 다니는 여행자가 지금 있는 곳에서 기분 하나로 갈 곳 3곳을 받는 제주 무계획 여행 앱이에요. 일정이나 코스는 짜 드리지 않아요.</p>
            <p>푹 쉬고 싶어, 좀 걷고 싶어, 새로운 거 해보고 싶어, 맛있는 거 먹고 싶어, 아무거나 골라줘. 다섯 기분 중 하나를 누르면 지금 위치나 숙소, 고른 동네에서 가까운 곳 세 군데를 차로 몇 분인지와 함께 골라 드려요.</p>
            <p>이 화면은 자바스크립트를 켜야 움직여요. 동네별로 먼저 보려면 <a href="/jeju/">P를 위한 제주 무계획 여행</a>에서 한경, 한림, 애월, 신제주, 구제주, 조천, 구좌, 우도, 대정, 안덕, 중문, 서귀포 시내, 남원, 표선, 성산을 둘러보세요.</p>
            <p>정보·사진: 비짓제주(제주관광공사)</p>
          </noscript>
        </section>

            <button class="tab" type="button" data-sub="sight" aria-pressed="false">구경</button>

        </section>
        <section id="savedView" aria-labelledby="savedTitle" hidden>
          <div class="head">
            <h1 class="title" id="savedTitle" tabindex="-1">저장한 곳<span class="count"></span></h1>
            <button class="tbtn back" type="button" data-action="close-saved">돌아가기</button>

          <div id="nudge" class="inform" hidden></div>
          <p class="sort"></p>
          <div class="picks"></div>
          <p class="foot">이 브라우저에만 저장돼요. 다른 기기나 앱에서는 안 보여요.</p>
          <div class="track" hidden>
            <p id="trackNote">써 본 기록을 남겨요(GA4·네이버 애널리틱스 포함). <a href="/privacy">자세히</a></p>
            <button class="tbtn" type="button" data-action="track" aria-describedby="trackNote">기록 끄기</button>
          </div>
          <div class="backup">
            <button class="tbtn" type="button" data-action="backup">링크로 백업</button>
            <p id="backupNote" class="note" role="status"></p>
          </div>
          <!-- ADR-0071: the map app the cards open; one line, remembered on this device -->
          <div class="mapapp" role="group" aria-labelledby="mapAppLabel">
            <p id="mapAppLabel">지도 앱</p>
            <button class="tbtn" type="button" data-action="map-app" data-app="naver" aria-pressed="true">네이버지도</button>
            <button class="tbtn" type="button" data-action="map-app" data-app="kakao" aria-pressed="false">카카오맵</button>
            <button class="tbtn" type="button" data-action="map-app" data-app="tmap" aria-pressed="false">TMAP</button>
          </div>
          <p id="mapAppNote" class="note" role="status"></p>
          <div class="about">
            <p class="credit">정보·사진: 비짓제주(제주관광공사) · <a href="https://www.visitjeju.net" target="_blank" rel="noopener">visitjeju.net</a></p>
            <a class="tbtn" href="/privacy">개인정보 처리 안내</a>
          </div>
        </section>
      </main>
    </div>
    <div id="sheet" hidden></div>
    <p id="announce" class="sr" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
