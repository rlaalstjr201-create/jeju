<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>내일 뭐하지</title>
    <meta name="description" content="기분을 고르면 제주에서 내일 갈 곳 세 군데를 골라 드려요." />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151718" media="(prefers-color-scheme: dark)" />
    <!-- first paint already in the right background, no white flash at night (S49). The only colour literals outside the CSS tokens. -->
    <style>html{background:#f7f7f5}@media (prefers-color-scheme:dark){html{background:#151718}}</style>
    <!-- a mood tapped before the app script has run (slow first visit) is kept; the app carries it out once loaded -->
    <script>(function(w){w.__early=function(e){var b=e.target&&e.target.closest&&e.target.closest('[data-mood]');if(b)w.__tap=b.getAttribute('data-mood')};w.addEventListener('click',w.__early,true)})(window)</script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="top">
        <button id="basis" class="basis" type="button" aria-haspopup="dialog" aria-label="내 주변, 기준 바꾸기"><span>내 주변</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <button id="saved" class="saved-btn" type="button" aria-pressed="false" aria-label="저장한 곳 0개" hidden><svg width="16" height="16" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.3s-7.4-4.5-9.2-9.1C1.6 8 3.5 4.6 6.9 4.6c2.1 0 3.6 1.2 5.1 3 1.5-1.8 3-3 5.1-3 3.4 0 5.3 3.4 4.1 6.6-1.8 4.6-9.2 9.1-9.2 9.1z"/></svg><span class="n">0</span></button>
      </header>
      <main id="main">
        <section id="home" aria-labelledby="ask">
          <p class="date" id="date"></p>
          <h1 class="ask" id="ask">내일은 어떤 기분이에요?</h1>
          <ul class="moods">
            <li><button class="mood" type="button" data-mood="rest"><span>푹 쉬고 싶어</span><svg class="i-go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><svg class="i-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></li>
            <li><button class="mood" type="button" data-mood="walk"><span>좀 걷고 싶어</span><svg class="i-go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><svg class="i-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></li>
            <li><button class="mood" type="button" data-mood="new"><span>새로운 거 해보고 싶어</span><svg class="i-go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><svg class="i-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></li>
            <li><button class="mood" type="button" data-mood="food"><span>맛있는 거 먹고 싶어</span><svg class="i-go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><svg class="i-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></li>
          </ul>
          <button class="any" type="button" data-mood="any"><span>아무거나 골라줘</span><svg class="i-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        </section>
        <section id="results" aria-labelledby="resultsTitle" hidden>
          <div class="head">
            <h1 class="title" id="resultsTitle" tabindex="-1"></h1>
            <button class="change" type="button" data-action="change" aria-label="기분 바꾸기">바꾸기</button>
          </div>
          <div id="foodSub" class="tabs" role="group" aria-label="먹을 것 종류" hidden>
            <button class="tab" type="button" data-sub="meal" aria-pressed="true">식사</button>
            <button class="tab" type="button" data-sub="cafe" aria-pressed="false">카페·디저트</button>
          </div>
          <p id="status" class="status" role="status"></p>
          <div id="cards" class="picks"></div>
        </section>
        <section id="savedView" aria-labelledby="savedTitle" hidden>
          <div class="head">
            <h1 class="title" id="savedTitle" tabindex="-1">저장한 곳<span class="count"></span></h1>
            <button class="change" type="button" data-action="close-saved">돌아가기</button>
          </div>
          <p class="sort"></p>
          <div class="picks"></div>
          <p class="foot"></p>
        </section>
      </main>
    </div>
    <div id="sheet" hidden></div>
    <p id="announce" class="sr" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
