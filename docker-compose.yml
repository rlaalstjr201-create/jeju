services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jeju-pg
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jeju123
      POSTGRES_DB: jeju
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    external: true
    name: 7d2b8f98d8a19db9a2b76f1dc82fa3311dfbd65a713bb92376fa37231273a6ce
