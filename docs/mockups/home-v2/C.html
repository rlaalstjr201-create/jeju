<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375">
<title>시안 C — 화면 가득 사진 + 아래 기분 칩 (트리플식)</title><link rel="stylesheet" href="base.css">
<style>
body { height: 812px; overflow: hidden; position: relative; background: #000; }
.bg { position: absolute; inset: 0 0 auto 0; height: 560px; }
.bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgb(0 0 0 / 45%) 0%, rgb(0 0 0 / 0%) 22%, rgb(0 0 0 / 0%) 45%, rgb(0 0 0 / 70%) 100%); }
.top { position: relative; z-index: 2; color: #fff; }
.top .chip { background: rgb(255 255 255 / 22%); color: #fff; }
.top .caret { color: #fff; }
.logo b, .logo .dot { color: #ffb27d; }
.logo .dot { background: #ffb27d; }
.lead { position: absolute; z-index: 2; left: 20px; right: 20px; top: 340px; color: #fff; }
.lead .kick { font-size: 13px; font-weight: 700; opacity: .9; }
.lead h2 { font-size: 30px; color: #fff; margin: 2px 0 6px; line-height: 1.2; }
.lead p { margin: 0 0 14px; font-size: 15px; opacity: .94; }
.lead .row { display: flex; gap: 8px; }
.lead .btn-main { background: #fff; color: var(--text); }
.lead .btn-ghost { background: rgb(255 255 255 / 22%); color: #fff; }
.sheet { position: absolute; z-index: 3; left: 0; right: 0; top: 548px; bottom: 0; background: #fff; border-radius: 24px 24px 0 0; padding: 16px 0 0; }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
.sheet h3 { margin: 0 16px 10px; font-size: 16px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px; }
.pill { flex: none; display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: var(--r-pill); background: var(--fill); font-weight: 600; font-size: 14.5px; white-space: nowrap; }
.pill.any { background: var(--acc-tint); color: #a8460a; }
.today2 { margin: 14px 16px 0; padding: 10px 14px; border-radius: 14px; background: var(--fill); font-size: 14px; }
.today2 .gray { color: var(--muted); }
</style></head><body>
<div class="bg photo" style="background-image:url('https://api.cdn.visitjeju.net/photomng/thumbnailpath/202408/16/f18ca648-b42f-4209-b87a-2410b8da656d.webp')"></div>
<div class="top">
  <button class="logo"><span class="dot"></span>여차나<b>:</b>제주
    <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
  <button class="chip">♥ 2</button>
</div>
<div class="lead">
  <div class="kick">지금 여기서</div>
  <h2>섭지코지</h2>
  <p>바다 위 절벽 길을 걷기 좋아요 · 차로 12분</p>
  <div class="row"><span class="btn-main">길찾기</span><span class="btn-ghost">↗ 같이 보기</span></div>
</div>
<div class="sheet">
  <div class="grab"></div>
  <h3>다른 걸 하고 싶다면</h3>
  <div class="chips">
    <span class="pill">푹 쉬고 싶어</span><span class="pill">좀 걷고 싶어</span><span class="pill">새로운 거</span><span class="pill">유명한 데</span><span class="pill">먹고 싶어</span><span class="pill any">아무거나</span>
  </div>
  <div class="today2"><b>10월 27일 화요일</b> <span class="gray">· 해 지는 시각 17:47</span></div>
</div>
</body></html>
