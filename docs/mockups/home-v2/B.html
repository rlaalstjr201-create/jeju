<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375">
<title>시안 B — 작은 가로 카드 + 기분 2열 사진 타일</title><link rel="stylesheet" href="base.css">
<style>
.hero { display: flex; margin: 14px 16px 0; border-radius: 20px; overflow: hidden; background: var(--fill); }
.hero .photo { flex: none; width: 128px; height: 148px; }
.hero .body { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.hero .kick { font-size: 12px; font-weight: 700; color: var(--main); }
.hero h2 { font-size: 19px; }
.hero p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.hero .row { display: flex; gap: 6px; }
.hero .btn-main { height: 40px; flex: 1; font-size: 14px; padding: 0 12px; }
.hero .btn-ghost { height: 40px; width: 40px; padding: 0; background: #fff; }
h3 { margin: 22px 16px 10px; font-size: 16px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px; }
.tile { position: relative; height: 112px; border-radius: 16px; overflow: hidden; }
.tile .photo { position: absolute; inset: 0; }
.tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgb(0 0 0 / 62%), rgb(0 0 0 / 5%) 70%); }
.tile span { position: absolute; z-index: 1; left: 12px; bottom: 10px; right: 10px; color: #fff; font-weight: 700; font-size: 14.5px; line-height: 1.3; }
.tile.any { background: var(--acc-tint); display: grid; place-items: center; }
.tile.any::after { display: none; }
.tile.any span { position: static; color: #a8460a; font-size: 15px; }
</style></head><body>
<div class="top">
  <button class="logo"><span class="dot"></span>여차나<b>:</b>제주
    <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
  <button class="chip">♥ 2</button>
</div>
<div class="today"><span class="sun">☀</span><b>10월 27일 화요일</b><span class="gray">· 해 지는 시각 17:47</span></div>

<section class="hero">
  <div class="photo" style="background-image:url('https://api.cdn.visitjeju.net/photomng/thumbnailpath/202408/16/f18ca648-b42f-4209-b87a-2410b8da656d.webp')"></div>
  <div class="body">
    <div><div class="kick">지금 여기서</div><h2>섭지코지</h2><p>절벽 길 산책 · 차로 12분</p></div>
    <div class="row"><span class="btn-main">길찾기</span><span class="btn-ghost">↗</span></div>
  </div>
</section>

<h3>지금 뭐 하고 싶어요?</h3>
<div class="grid">
  <div class="tile"><div class="photo" style="background-image:url('https://api.cdn.visitjeju.net/photomng/thumbnailpath/202408/27/6b6dc9c4-5466-493e-98e5-580dbf18eefc.webp')"></div><span>푹 쉬고 싶어</span></div>
  <div class="tile"><div class="photo" style="background-image:url('https://api.cdn.visitjeju.net/photomng/thumbnailpath/202410/15/ec11cb19-cd96-4036-b302-9730035bf052.webp')"></div><span>좀 걷고 싶어</span></div>
  <div class="tile"><div class="photo" style="background-image:url('https://api.cdn.visitjeju.net/photomng/thumbnailpath/202410/16/54503744-a4b3-4e68-b819-47e67df59100.webp')"></div><span>새로운 거 해보고 싶어</span></div>
  <div class="tile"><div class="photo" style="background-image:url('https://api.cdn.visitjeju.net/photomng/thumbnailpath/202409/20/464d6099-295a-4e60-bd93-9e65388f4d0d.webp')"></div><span>유명한 데 가 보고 싶어</span></div>
  <div class="tile"><div class="photo" style="background-image:url('https://api.cdn.visitjeju.net/photomng/thumbnailpath/202111/12/2cee35af-0c35-4448-b32d-179bf66c2dd1.webp')"></div><span>맛있는 거 먹고 싶어</span></div>
  <div class="tile any"><span>아무거나 골라줘</span></div>
</div>
</body></html>
