# 「이번 주 서울」 매주 회차(ADR-0118)와 서울 매일 발굴(ADR-0123)이 push한 자료만 운영에 내보낸다.
# 클라우드 루틴은 수집·판정·감사·push까지만 하고(토큰 없음), 배포는 여기서 한다.
# 이 push에 이번 주 자료 밖의 파일이 섞여 있으면 배포하지 않는다(코드 배포는 지금처럼 사람이 확인한 뒤 손으로).
name: deploy weekly Seoul

on:
  push:
    branches: [master]
    paths:
      - apps/web/data/seoul/weekly-seoul.json
      - apps/web/data/seoul/discovery-seoul.json
  # by hand from the Actions tab (a dry run of this pipeline on master as it is)
  workflow_dispatch:

concurrency:
  group: deploy-weekly-seoul
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Against what is live, not only this push: the live entry JS carries its build commit (vite.config.ts appVersion).
      # Code pushed but not yet deployed by hand must not go out with the morning's data.
      - name: Only weekly data since the live build
        if: github.event_name == 'push'
        run: |
          js=$(curl -fsS https://yeochana.com/ | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          [ -n "$js" ] || { echo "live entry JS not found"; exit 1; }
          live=""
          for h in $(curl -fsS "https://yeochana.com/$js" | grep -oE '"[0-9a-f]{7,12}"' | tr -d '"' | sort -u); do
            if git cat-file -e "$h^{commit}" 2>/dev/null; then live="$h"; break; fi
          done
          [ -n "$live" ] || { echo "live build commit not found in this repository"; exit 1; }
          echo "live build commit: $live"
          # paths that do not change the build: notes, reviews, QA images, CI, the weekly/discovery data itself
          others=$(git diff --name-only "$live" "${{ github.sha }}" | grep -vE '^(docs/|specs/|plans/|\.claude/|\.scratch/|\.github/|apps/web/review/|apps/web/design/|apps/web/data/seoul/(weekly|discovery)-seoul\.json$)' || true)
          if [ -n "$others" ]; then echo "build inputs changed since the live build and are not deployed yet; deploy by hand first:"; echo "$others"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type check and tests
        working-directory: apps/web
        run: |
          npx tsc --noEmit
          npx vitest run
          npx vitest run --mode nation

      - name: Build
        working-directory: apps/web
        env:
          SITE_URL: https://yeochana.com
        run: npm run build

      - name: Entry budget (ADR-0116)
        working-directory: apps/web
        # the same measure as scripts/jeju-baseline.ts assets(): index-*.js/css named in dist/index.html, gzipped (check:jeju itself needs a local browser)
        run: |
          node -e "
          const fs=require('fs'),z=require('zlib');
          const html=fs.readFileSync('dist/index.html','utf8');
          const files=[...html.matchAll(/(?:src|href)=\"\/(assets\/index-[A-Za-z0-9_-]{8}\.(?:js|css))\"/g)].map(m=>m[1]);
          if(!files.length){console.error('no entry files found');process.exit(1)}
          const total=files.reduce((s,f)=>s+z.gzipSync(fs.readFileSync('dist/'+f)).length,0);
          console.log('Korean entry JS+CSS gzip:',total,'B (budget 70000 B)',files.join(' '));
          if(total>70000)process.exit(1);"

      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.158.0 pages deploy dist --project-name yeochana --branch master --commit-dirty=true

      - name: Smoke
        working-directory: apps/web
        env:
          SITE: https://yeochana.com
        run: bash scripts/smoke.sh
